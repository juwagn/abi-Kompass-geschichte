<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abi-Kompass Geschichte LK 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Lora:ital,wght@0,400..600;1,400..500&family=Outfit:wght@500..700&display=swap">
<style>
/* Abi-Kompass Geschichte LK 2027 – Design-Schema Geschichte NRW (Navy/Gelb) */
:root{
  --ground:#f4f7fd; --surface:#ffffff; --surface-2:#eef3fb; --surface-3:#f7faff;
  --rule:#d9e2f1; --rule-strong:#c0d0ea;
  --ink:#1f2a3d; --muted:#5a6b85; --heading:#14375e;
  --navy:#14375e; --navy-2:#1e3a6e; --blue:#2f5aa8; --blue-soft:#e8f0fb;
  --gold:#f5c518; --gold-ink:#8a6a1a; --gold-soft:#fdf6df; --gold-rule:#f0d97a;
  --side-bg:#14375e; --side-bg-2:#1e3a6e; --side-ink:#e4ecf9; --side-muted:#aac4ee; --side-active:#24497f;
  --lv0:#8b1a1a; --lv0-bg:#fde8e8; --lv1:#7a6000; --lv1-bg:#fef9e0;
  --lv2:#2f5aa8; --lv2-bg:#e8f0fb; --lv3:#2d5016; --lv3-bg:#e8f5e1;
  --ok:#2d5016; --ok-bg:#e8f5e1; --bad:#8b1a1a; --bad-bg:#fde8e8;
  --shadow:0 1px 2px rgba(20,55,94,.06),0 6px 18px rgba(20,55,94,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --f-label:'Outfit','DM Sans',system-ui,sans-serif;
  --f-serif:'Lora',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1624; --surface:#142033; --surface-2:#1a2a42; --surface-3:#172538;
    --rule:#2a3d5c; --rule-strong:#36507a;
    --ink:#e4ecf9; --muted:#9fb0ca; --heading:#dbe7fa;
    --navy:#0b1f38; --navy-2:#132c4f; --blue:#8fb0ea; --blue-soft:#1c2d4d;
    --gold:#f5c518; --gold-ink:#f2d46e; --gold-soft:#2a2512; --gold-rule:#6b5a1c;
    --side-bg:#0a1a30; --side-bg-2:#10243f; --side-ink:#e4ecf9; --side-muted:#8fa8cc; --side-active:#1b3a63;
    --lv0:#f3a9a9; --lv0-bg:#3a1c20; --lv1:#f0d77a; --lv1-bg:#372f12;
    --lv2:#a9c4f5; --lv2-bg:#1c2d4d; --lv3:#a8d99a; --lv3-bg:#1d3320;
    --ok:#a8d99a; --ok-bg:#1d3320; --bad:#f3a9a9; --bad-bg:#3a1c20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1624; --surface:#142033; --surface-2:#1a2a42; --surface-3:#172538;
  --rule:#2a3d5c; --rule-strong:#36507a;
  --ink:#e4ecf9; --muted:#9fb0ca; --heading:#dbe7fa;
  --navy:#0b1f38; --navy-2:#132c4f; --blue:#8fb0ea; --blue-soft:#1c2d4d;
  --gold:#f5c518; --gold-ink:#f2d46e; --gold-soft:#2a2512; --gold-rule:#6b5a1c;
  --side-bg:#0a1a30; --side-bg-2:#10243f; --side-ink:#e4ecf9; --side-muted:#8fa8cc; --side-active:#1b3a63;
  --lv0:#f3a9a9; --lv0-bg:#3a1c20; --lv1:#f0d77a; --lv1-bg:#372f12;
  --lv2:#a9c4f5; --lv2-bg:#1c2d4d; --lv3:#a8d99a; --lv3-bg:#1d3320;
  --ok:#a8d99a; --ok-bg:#1d3320; --bad:#f3a9a9; --bad-bg:#3a1c20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--gold);color:#14375e;padding:8px 14px;border-radius:6px;z-index:100;font-weight:600}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 16px 18px}
.brand{padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .eb{font-family:var(--f-label);font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.brand .nm{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.05;margin-top:6px;letter-spacing:-.4px}
.brand .nm span{color:var(--gold)}
.brand .bar{height:3px;width:44px;background:var(--gold);border-radius:2px;margin:12px 0 10px}
.brand .cd{font-size:13px;color:var(--side-ink)}
.brand .cd b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px;flex:1}
.nav .grp{font-family:var(--f-label);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--side-muted);margin:14px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--side-bg-2)}
.nav a[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side-foot{display:flex;flex-direction:column;gap:8px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12);margin-top:12px}
.themebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--side-bg-2);border:1px solid rgba(255,255,255,.14);color:var(--side-ink);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}
.side-foot small{font-size:11.5px;color:var(--side-muted);line-height:1.45}

.topbar{display:none}
.main{min-width:0;padding-block:28px 60px;padding-inline:clamp(16px,4vw,48px)}
.page{max-width:1040px;margin:0 auto}

/* ---------- Page header ---------- */
.phead{margin-bottom:22px}
.eyebrow{font-family:var(--f-label);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--blue);font-weight:600}
h1{font-family:var(--f-display);color:var(--heading);font-weight:800;font-size:clamp(26px,3.6vw,36px);line-height:1.12;letter-spacing:-.6px;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);color:var(--heading);font-size:21px;line-height:1.25;margin:34px 0 12px;text-wrap:balance}
h3{font-family:var(--f-display);color:var(--heading);font-size:16.5px;margin:0 0 8px;line-height:1.3}
.leitfrage{font-family:var(--f-serif);font-style:italic;font-size:18px;color:var(--ink);margin:12px 0 0;max-width:62ch;line-height:1.5}
.goldbar{height:3px;width:52px;background:var(--gold);border-radius:2px;margin:14px 0 0}
.lead{max-width:68ch;color:var(--muted);margin:10px 0 0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Chips & badges ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-size:11.5px;font-weight:600;letter-spacing:.4px;padding:3px 10px;border-radius:20px;background:var(--surface-2);color:var(--heading);border:1px solid var(--rule);white-space:nowrap}
.chip.fokus{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-rule);white-space:normal;line-height:1.35}
.chip.zum{white-space:normal}
.chip.zum{background:var(--surface);color:var(--muted)}
.chip.sk{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.uk{background:var(--navy);color:var(--gold);border-color:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] button.chip[aria-pressed="true"]{background:var(--blue);color:#0d1624}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.chip[aria-pressed="true"]{background:var(--blue);color:#0d1624}}
.star{color:var(--gold-ink)}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
.card.lift{box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.note{background:var(--surface-3);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 16px;color:var(--ink);font-size:14.5px}
.method{background:var(--gold-soft);border:1px solid var(--gold-rule);border-top:4px solid var(--gold);border-radius:10px;padding:14px 18px}
.method .eb{font-family:var(--f-label);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin-bottom:6px}
.bridge{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#e4ecf9;border-radius:12px;padding:16px 20px}
.bridge .eb{font-family:var(--f-label);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.bridge b{color:#fff}
.bridge a{color:#ffe27a}
ul.tight{margin:6px 0 0;padding-left:1.1em}
ul.tight li{margin:3px 0}
ul.tight li::marker{color:var(--blue)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:9px 16px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--heading);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#14375e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#14375e}}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* ---------- Dashboard ---------- */
.dash-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.countdown{background:linear-gradient(135deg,var(--navy),var(--navy-2) 60%,#2a4d8a);color:#fff;border-radius:14px;padding:22px 24px;position:relative;overflow:hidden}
.countdown .eb{font-family:var(--f-label);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:#aac4ee;font-weight:600}
.countdown .big{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,7vw,64px);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
.countdown .big small{font-size:20px;font-weight:600;letter-spacing:0;margin-left:6px}
.countdown .sub{margin-top:8px;color:#e4ecf9;font-size:14.5px}
.countdown .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-family:var(--f-label);font-size:12.5px;color:#cfe0fb}
.countdown svg.needle{position:absolute;right:-18px;top:-18px;width:170px;height:170px;opacity:.16}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ringcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
.ringcard:hover{border-color:var(--blue)}
.ring{flex:none}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--blue);transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--heading);font-family:var(--f-display);font-weight:700;font-size:13px}
.ringcard .t{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--blue)}
.ringcard .d{font-size:13.5px;line-height:1.35}
.week-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.task input{margin-top:4px;width:17px;height:17px;accent-color:var(--blue);flex:none}
.task .lbl{flex:1;min-width:0}
.task .lbl a{font-weight:600;text-decoration:none;color:var(--heading)}
.task .lbl a:hover{text-decoration:underline}
.task .meta{font-family:var(--f-label);font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.task.done .lbl{opacity:.55;text-decoration:line-through}
.tagph{font-family:var(--f-label);font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:12px}
.ph-A{background:var(--blue-soft);color:var(--blue)}
.ph-B{background:var(--gold-soft);color:var(--gold-ink)}
.ph-C{background:var(--lv3-bg);color:var(--lv3)}
.ph-F{background:var(--surface-2);color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;counter-reset:st}
.steps .card{position:relative;padding-left:58px}
.steps .card::before{counter-increment:st;content:counter(st);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}

/* ---------- Themenkarte ---------- */
.ifsec{margin-top:26px}
.ifhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:12px}
.ifhead .no{font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff;background:var(--navy);border-radius:6px;padding:1px 9px}
:root[data-theme="dark"] .ifhead .no{background:var(--blue);color:#0d1624}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ifhead .no{background:var(--blue);color:#0d1624}}
.ifhead h2{margin:0;font-size:19px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--blue);transform:translateY(-1px)}
.tile .top{display:flex;gap:12px;align-items:center}
.tile .tt{font-family:var(--f-display);font-weight:700;color:var(--heading);font-size:15.5px;line-height:1.28}
.tile .q{font-family:var(--f-serif);font-style:italic;color:var(--muted);font-size:13.5px;line-height:1.45}
.tile .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- Schwerpunkt ---------- */
.sp-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.sp-aside{position:sticky;top:18px;display:flex;flex-direction:column;gap:12px}
.ke{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.ke.fk{border-color:var(--gold-rule);box-shadow:inset 4px 0 0 var(--gold)}
.ke-head{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ke-text{flex:1 1 320px;min-width:0;font-weight:600;color:var(--heading);line-height:1.45}
.ke-text .pre{font-weight:400;color:var(--muted)}
.lvl{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 4px;border:0;padding:0}
.lvl legend{font-family:var(--f-label);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;float:left;width:100%}
.lvl label{position:relative;cursor:pointer}
.lvl input{position:absolute;opacity:0;inset:0;cursor:pointer}
.lvl span{display:inline-block;padding:5px 11px;border-radius:7px;border:1px solid var(--rule);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-3)}
.lvl input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.lvl input[value="0"]:checked+span{background:var(--lv0-bg);color:var(--lv0);border-color:transparent}
.lvl input[value="1"]:checked+span{background:var(--lv1-bg);color:var(--lv1);border-color:transparent}
.lvl input[value="2"]:checked+span{background:var(--lv2-bg);color:var(--lv2);border-color:transparent}
.lvl input[value="3"]:checked+span{background:var(--lv3-bg);color:var(--lv3);border-color:transparent}
.stich{columns:2 300px;column-gap:26px;margin:10px 0 0;padding-left:1.1em}
.stich li{break-inside:avoid;margin:0 0 5px}
.stich li::marker{color:var(--blue)}
.urteil{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.urteil .col{border-radius:9px;padding:10px 14px;font-size:14px}
.urteil .col.pro{background:var(--lv3-bg)}
.urteil .col.con{background:var(--lv0-bg)}
.urteil .col h4{margin:0 0 4px;font-family:var(--f-label);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase}
.urteil .col.pro h4{color:var(--lv3)} .urteil .col.con h4{color:var(--lv0)}
.urteil ul{margin:0;padding-left:1.05em}
.ufrage{font-family:var(--f-serif);font-style:italic;font-size:15.5px;margin-top:10px;color:var(--ink)}
.ufrage::before{content:"Urteilsfrage · ";font-family:var(--f-label);font-style:normal;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
details.help{border:1px solid var(--rule);border-radius:10px;background:var(--surface);margin-bottom:8px}
details.help>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--heading);list-style:none;display:flex;gap:10px;align-items:center}
details.help>summary::-webkit-details-marker{display:none}
details.help>summary::before{content:"+";font-family:var(--f-display);font-weight:800;color:var(--blue);width:14px}
details.help[open]>summary::before{content:"–"}
details.help>div{padding:0 16px 14px 38px;font-size:14.5px}
.lvlbadge{font-family:var(--f-label);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-left:auto}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--rule);padding:6px 0;font-size:14px}
.stat b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
textarea.notes{width:100%;min-height:110px;border:1px solid var(--rule);border-radius:9px;background:var(--surface-3);padding:10px 12px;resize:vertical;font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;font-family:var(--f-label);font-weight:600;letter-spacing:.3px;text-align:left;padding:9px 11px;vertical-align:bottom}
td{padding:9px 11px;border-top:1px solid var(--rule);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--surface-3)}
td.st{font-family:var(--f-display);font-weight:700;color:var(--heading);white-space:nowrap}
.tbl-min{min-width:760px}

/* ---------- Zeitleiste ---------- */
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--rule);margin-left:62px}
.tl li{position:relative;padding:7px 0 7px 18px}

/* ---------- Karteikarten ---------- */
.flash{perspective:1400px;max-width:640px;margin:0 auto}
.flash-inner{position:relative;min-height:280px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow);padding:26px 28px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--surface-3)}

.face .q{font-family:var(--f-display);font-weight:700;color:var(--heading);font-size:clamp(20px,3vw,26px);line-height:1.25;margin-top:auto;margin-bottom:auto;padding:12px 0;text-wrap:balance}
.face .a{font-size:15.5px;margin-top:10px}

.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;text-align:center}
.boxes div{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 6px}

.boxes span{font-family:var(--f-label);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.progressbar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--blue);border-radius:4px}

/* ---------- Lexikon ---------- */

.lexitem .bm{font-family:var(--f-label);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold-ink);margin-left:6px}
.lexitem .df{font-size:14px;margin-top:4px}

.field{display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);z-index:60}

.kp-ke .boxes4 span.on{background:var(--blue);border-color:var(--blue)}

/* ---------- Dossier-Komponenten ---------- */
.dossier-card{border-left:4px solid var(--navy);margin-bottom:20px;transition:box-shadow .2s ease}

.dossier-hook{margin:0 0 14px;padding:12px 16px;background:var(--surface-2);border-left:4px solid var(--gold);border-radius:0 8px 8px 0}

.if-dossier-card{border-left:4px solid var(--blue);margin-bottom:14px;background:var(--surface)}
.if-dossier-sum{cursor:pointer;list-style:none;user-select:none}
.if-dossier-sum::-webkit-details-marker{display:none}

.dossier-lex-card{border-left:4px solid var(--gold);margin-bottom:16px}

const IFS = {
  4:{t:'Die moderne Industriegesellschaft zwischen Fortschritt und Krise', k:'Industriegesellschaft',
     dossier:{
       leitfrage:'In welchem Maße bedingten technischer Fortschritt, kapitalistische Hochindustrialisierung und imperiale Machtansprüche die existenziellen Krisen der Moderne zwischen 1880 und 1933?',
       epochenueberblick:'Das Inhaltsfeld 4 umfasst den tiefgreifenden Epochenwandel von der hochindustriellen Transformation des Deutschen Kaiserreichs über den Hochimperialismus und den Ersten Weltkrieg bis zur Weltwirtschaftskrise von 1929. Die „Zweite Industrielle Revolution“ schuf die materielle Basis einer modernen Massengesellschaft, riss traditionelle Bindungen auf und erzeugte durch Verstädterung, Fabrikdisziplin und soziale Verwerfungen die „Soziale Frage“, auf die der Staat mit repressiven Gesetzen und einer wegweisenden Sozialgesetzgebung reagierte. Gleichzeitig entlud sich das imperiale Macht- und Prestigestreben der europäischen Großmächte im kolonialen Wettlauf um Afrika und mündete 1914 im ersten industrialisierten Massenkrieg der Geschichte. Die Zwischenkriegszeit schließlich zeigte die fragile Interdependenz weltwirtschaftlicher Kreisläufe: Der New Yorker Börsencrash 1929 leitete eine Systemkrise ein, die die Weimarer Republik in ihren Grundfesten erschütterte und den Weg in die Diktatur ebnete.',
       abiturleitfaden:'Für das Abitur 2027 im Leistungskurs Geschichte stehen in IF 4 insbesondere die Lebenswirklichkeit der Industriearbeiterschaft (S1), die kolonialen Mechanismen am Beispiel Afrikas (S2) sowie die ökonomischen Krisenentscheidungen und internationalen Interdependenzen der Weltwirtschaftskrise (S3) im Fokus. Beachten Sie bei Quellenanalysen stets die Verschränkung ökonomischer Modernisierung mit sozialer Segregation und imperialer Ideologie. Zentral für Anforderungsbereich III ist das reflektierte Sach- und Werturteil über das „Fortschrittsparadigma“ sowie die Rationalitätskrisen der Moderne.'

       epochenueberblick:'Das Inhaltsfeld 5 bildet das Kernstück des deutschen Geschichtsbewusstseins und der Abiturprüfung. Es analysiert die multikausalen Ursachen für das Scheitern der ersten deutschen Demokratie und den Aufstieg der NSDAP im Zusammenspiel von strukturellen Krisen, antidemokratischen Eliten und totalitärer Ideologie. Die NS-Herrschaft wird in ihrer doppelten Realität von „Verführung und Gewalt“ sichtbar: Einerseits propagandistische Inszenierung der „Volksgemeinschaft“, Scheinblüte durch kriegsvorbereitende Aufrüstung und partielle Konsumangebote; andererseits terroristische Gleichschaltung, polykratisches Herrschaftschaos und die planmäßige Entrechtung, Verfolgung und industrielle Ermordung von sechs Millionen europäischen Jüdinnen und Juden (Shoah) sowie weiterer Opfergruppen im rassenideologischen Vernichtungskrieg. Nach 1945 vollzog sich die Auseinandersetzung mit den Verbrechen in den Besatzungszonen und den beiden Teilstaaten im Spannungsfeld von justizieller Ahndung, vergangenheitspolitischem Beschweigen und allmählicher Etablierung einer selbstkritischen Erinnerungskultur.',
       abiturleitfaden:'Die Vorgaben 2027 akzentuieren im LK die NS-Wirtschaftspolitik (Diskrepanz zwischen Propaganda und kriegsgetriebener Verschuldung), die differenzierten Verhaltensweisen zwischen Anpassung und Widerstand (speziell 20. Juli 1944 und Jugendopposition wie Edelweißpiraten/Weiße Rose) sowie die divergierende Praxis der Entnazifizierung in den vier Besatzungszonen. Bei Quellenanalysen müssen nationalsozialistische Begriffe („Volksgemeinschaft“, „Arisierung“, „Sonderbehandlung“) stets distanzierend in Anführungszeichen gesetzt und dekonstruiert werden. In Teilaufgabe 3 verlangt das Abitur ein methodisch sauberes Urteil unter Rückgriff auf geschichtswissenschaftliche Kontroversen (Broszat, Mommsen, Kershaw, Frei, Diner).'

     dossier:{
       leitfrage:'Wie wandelte sich der deutsche Nationalismus von einer emanzipatorischen Freiheitsbewegung des Vormärz zu einer aggressiv-ausgrenzenden Ideologie, und wie entwickelte sich nationale Identität unter den Bedingungen von Teilung und Wiedervereinigung?',
       epochenueberblick:'Inhaltsfeld 6 durchmisst zwei Jahrhunderte deutscher Nationsbildung. Ausgehend von den antinapoleonischen Befreiungskriegen und der Suche nach bürgerlicher Freiheit und Einheit im Vormärz (Hambacher Fest 1832) stand die Revolution von 1848/49 vor dem Dilemma, Einheit und Freiheit gleichzeitig erkämpfen zu müssen. Nach dem Scheitern der Paulskirche vollzog Bismarck 1871 die Reichsgründung „von oben“ als Fürstenbund durch „Blut und Eisen“. Damit einher ging eine fatale Funktionsverschiebung des Nationalismus: Aus einer demokratischen Emanzipationsbewegung wurde ein staatstragender, autoritärer Reichsnationalismus, der innere Geschlossenheit durch die Ausgrenzung vermeintlicher „Reichsfeinde“ (Katholiken im Kulturkampf, Sozialdemokraten, Juden) herstellte und im völkisch-rassistischen Wahn des Nationalsozialismus kulminierte. Nach 1945 spaltete der Kalte Krieg die Nation in zwei gegensätzliche Gesellschafts- und Verfassungsordnungen, bis die Friedliche Revolution von 1989 die Überwindung der deutschen Teilung erzwang.',

       epochenueberblick:'Inhaltsfeld 7 ist als diachroner Längsschnitt konzipiert, der die vier epochemachenden Friedensschlüsse der europäischen Moderne (1648, 1815, 1919, 1945) nach identischen Analysekategorien vergleicht: Akteure, Leitprinzipien, Umgang mit dem Besiegten, institutionelle Sicherungsmechanismen und historische Stabilität. Der Westfälische Frieden von 1648 begründete das Prinzip multilateraler Verhandlungsdiplomatie und konfessioneller Parität im Reich (ausschließlich im LK obligatorisch!). Der Wiener Kongress von 1815 schuf über die Pentarchie und das Gleichgewicht der Mächte eine erstaunlich langlebige zwischenstaatliche Stabilität, erkaufte diese jedoch durch innere Restauration und Unterdrückung der Freiheitsbewegungen. Der Versailler Vertrag von 1919 scheiterte am ungelösten Spannungsverhältnis zwischen Wilsons idealistischem Selbstbestimmungsrecht und französischem Sicherheitsbedürfnis, was zu einem instabilen Nachkriegssystem führte. Die Nachkriegsordnung nach 1945 schließlich institutionalisierte mit den Vereinten Nationen (UNO), der Blockkonfrontation und später dem KSZE-Prozess ein System kollektiver Sicherheit, das den „Langen Frieden“ in Europa bis 1989/90 absicherte.',

 ls:['krise'],
 dossier:{
  hook:{
   zitat:'Wissenschaft und Technik sind die gewaltigen Hebel, welche den Wohlstand der Nationen heben, aber sie schaffen auch neue Gefahren und soziale Gegensätze von ungeahnter Schärfe.',
   quelle:'Ernst Abbe (Physiker, Industrieller und Sozialreformer, Zeiss-Werke Jena), 1900',
   frage:'War die Hochindustrialisierung um 1900 ein Triumph des zivilisatorischen Fortschritts oder der Beginn einer Epoche entfremdeter Ausbeutung und sozialer Zerreißproben?'
  },
  ueberblick:'Zwischen 1880 und dem Vorabend des Ersten Weltkriegs vollzog das Deutsche Kaiserreich den rasanten Übergang vom Agrar- zum hochmodernen Industriestaat. Getragen von den neuen Leitsektoren der Elektrotechnik (Siemens, AEG) und der Chemieindustrie (BASF, Bayer) sowie dem modernen Maschinenbau verschmolzen betriebliche Forschung und universitäre Wissenschaft zu einer neuen Produktivkraft. Zugleich wuchs die Bevölkerung von 41 Millionen (1871) auf rund 65 Millionen (1910), angetrieben von enormen Binnenwanderungen in die Montanreviere an Rhein und Ruhr („Ruhrpolen“). Großstädte expandierten rasant: Berlin entwickelte sich mit über zwei Millionen Einwohnern zur pulsierenden Metropole. Technische Pionierleistungen wie Kanalisation, Elektrifizierung und Stadtschnellbahnen prägten das neue Gesicht der Massengesellschaft, standen jedoch in scharfem Kontrast zu rigider sozialer Segregation zwischen großbürgerlichen Villenvierteln und dunklen Arbeiter-Mietskasernen mit engen Hinterhöfen.\n\nFür die Industriearbeiterschaft brachte die Hochindustrialisierung eine radikale Disziplinierung des Alltags durch Akkordarbeit, Stechuhr und das Regime des Taylorismus mit sich. Die Fabrikordnungen forderten Zehn- bis Zwölfstundenschichten unter extremen gesundheitlichen Risiken. Reichskanzler Otto von Bismarck reagierte auf das Erstarken der sozialistischen Arbeiterbewegung mit einer Doppelstrategie: Neben der polizeistaatlichen Unterdrückung durch das Sozialistengesetz (1878–1890) initiierte er eine weltgeschichtlich wegweisende Sozialversicherung (Kranken- 1883, Unfall- 1884, Invaliditäts- und Altersversicherung 1889). Dieses „Zuckerbrot“ sollte die Loyalität der Industriearbeiter an den monarchischen Staat binden, konnte jedoch das Verlangen nach echter politischer Partizipation und sozialer Gleichberechtigung nicht ersticken.',
  abiSpotlight:{
   fokusTipp:'LK-Fokussierung 2027: Beherrschen Sie das Spannungsverhältnis zwischen technologischer Modernisierung und der realen Lebenswirklichkeit der Industriearbeiterschaft. Differenzieren Sie zwischen Bismarcks Doppelstrategie („Zuckerbrot und Peitsche“) und den konkreten Arbeits- und Wohnbedingungen (Akkordarbeit, Mietskasernen, Schlafgängerwesen).',
   operatorenHinweis:'Bei Operatoren wie „beschreiben“ (AFB I) und „erläutern“ (AFB II) kausale Zusammenhänge bilden: Verknüpfen Sie Leitsektoren → Fabrikdisziplin/Akkord → Binnenwanderung/Urbanisierung → soziale Frage → staatliche Sozialgesetzgebung und gewerkschaftliche Selbsthilfe.',
   urteilHinweis:'Für das Sach- und Werturteil zum „Fortschrittsparadigma“ müssen Sie Kriterien offenlegen: Trennen Sie ökonomische Wachstumsindikatoren (Reallöhne, Lebenserwartung, Infrastruktur) von sozialen und ökologischen Kosten (Ausbeutung, Entwurzelung, Umweltzerstörung der Montanlandschaften).'
  },

  },

{id:'IF4-S2', if:4, t:'Vom Hochimperialismus zum ersten „modernen“ Krieg der Industriegesellschaft',
 short:'Hochimperialismus und Erster Weltkrieg',
 q:'Führte der Wettlauf um Kolonien und Weltgeltung zwangsläufig in den Weltkrieg?',
 fokus:['Merkmale, Motive, Ziele, Funktionen und Formen des Imperialismus am Beispiel Afrikas'],
 zum:[['141–152','Info: Imperialistische Expansion und Konflikte'],['153–155','Warum Expansion? Begründungen und Kritik'],['156–160','„Scramble for Africa“: Kongo-Konferenz'],['161–164','Kolonialkriege in Afrika am deutschen Beispiel'],['165–167','Forum: Historiker ziehen Bilanz'],['169–182','Info: Von der Julikrise zum globalen Krieg'],['183–196','Kriegsziele · Propaganda · Kriegsalltag · Kriegsschuld']],
 ls:['krise'],
 dossier:{
  hook:{
   zitat:'Wir wollen niemand in den Schatten stellen, aber wir verlangen auch unseren Platz an der Sonne.',
   quelle:'Bernhard von Bülow (späterer Reichskanzler), Reichstagsrede vom 6. Dezember 1897',
   frage:'War der imperiale Wettlauf um Kolonien und Weltgeltung eine zwangsläufige Triebfeder für den Zusammenbruch der europäischen Friedensordnung von 1914?'
  },
  ueberblick:'In der Epoche des Hochimperialismus (ca. 1880–1914) traten die europäischen Großmächte sowie die USA und Japan in einen weltweiten Wettlauf um koloniale Territorien, Rohstoffquellen und strategische Absatzmärkte ein. Angetrieben von ökonomischen Interessen, nationalem Prestigestreben („Platz an der Sonne“) und sozialimperialistischer Krisenablenkung legitimierten die Kolonialherren ihre Herrschaft durch pseudowissenschaftlichen Sozialdarwinismus und rassistische Heilslehren einer vermeintlichen „Zivilisierungsmission“. Auf der Berliner Kongo-Konferenz 1884/85 wurde der afrikanische Kontinent am Reißbrett nach dem Grundsatz der „effektiven Okkupation“ aufgeteilt. In den deutschen Kolonien wie Deutsch-Südwestafrika manifestierte sich die Herrschaftspraxis in rigoroser Landenteignung, Zwangsarbeit und rechtloser Unterdrückung. Als sich die Herero und Nama 1904 gegen das Kolonialregime erhoben, beantwortete Generalleutnant Lothar von Trotha den Aufstand mit einem expliziten Vernichtungsbefehl – dem Völkermord an den Herero und Nama, der als erster Völkermord des 20. Jahrhunderts in die Geschichte einging.\n\nDie globalen imperialen Rivalitäten (Faschoda-Krise, Marokkokrisen) und das deutsch-britische Flottenwettrüsten führten zur Erstarrung der europäischen Bündnissysteme in zwei feindliche Blöcke (Mittelmächte vs. Triple Entente). Als im Sommer 1914 das Attentat von Sarajevo die Julikrise auslöste, beschleunigte die deutsche Reichsleitung mit dem bedingungslosen „Blankoscheck“ an Österreich-Ungarn die Eskalation. Der Erste Weltkrieg verwandelte sich binnen Monaten in den ersten industrialisierten Materialkrieg: Maschinengewehre, Giftgas, Panzer und schwere Artillerie führten an der Westfront in die Hölle des Stellungskriegs (Verdun, Somme). Die totale Mobilisierung der Volkswirtschaft durch das Hindenburg-Programm und das vaterländische Hilfsdienstgesetz sowie die drückende Versorgungsnot an der „Heimatfront“ („Steckrübenwinter“ 1916/17) machten die gesamte Gesellschaft zum Teil der Kriegsmaschinerie.',
  abiSpotlight:{
   fokusTipp:'LK-Fokussierung 2027: Beherrschen Sie das Fallbeispiel Afrika in allen Dimensionen – Motive (ökonomisch, machtpolitisch, sozialimperialistisch, sozialdarwinistisch), Formen (formelle Kolonie vs. informelle Einflusszonen) und die brutale Herrschaftspraxis bis hin zum Völkermord an den Herero und Nama (Trothas Vernichtungsbefehl 1904).',
   operatorenHinweis:'Der Operator „charakterisieren am Beispiel der Kriegspropaganda“ verlangt die systematische Dekonstruktion von Feindbildern (z. B. „perfides Albion“, „Kulturbarbaren“) und deren Mobilisierungsfunktionen für die Heimatfront und den Burgfrieden.',
   urteilHinweis:'Für die Urteilskompetenz zur Kriegsschuld ist eine profunde Gegenüberstellung der Forschungspositionen unerlässlich: Setzen Sie Fritz Fischers These vom deutschen „Griff nach der Weltmacht“ (gezielte Risikopolitik, Septemberprogramm) mit Christopher Clarks These der „Schlafwandler“ (multilaterale Krisendynamik aller Mächte) multiperspektivisch in Beziehung.'
  },
  kontroverse:{
   name:'Die Kriegsschuld-Debatte: Fritz Fischer vs. Christopher Clark',
   these:'Fritz Fischer (1961) belegt anhand von Dokumenten wie dem Septemberprogramm 1914, dass die deutsche Führung einen europäischen Hegemonialkrieg planmäßig riskierte und expansive Kriegsziele verfolgte.',
   gegenposition:'Christopher Clark (2012) widerspricht dem deutschen Alleinschuld-Paradigma: Die europäischen Regierungen seien wie „Schlafwandler“ blind durch wechselseitiges Misstrauen, serbischen Nationalismus und militärische Mobilisierungsmechanismen in den Krieg geraten.'
  },
  quellen:[

  ]
 },

 q:'Warum wurde aus einem Börsenkrach in New York eine Weltkrise – und hätte die Politik sie abmildern können?',

 zum:[['198–207','Info: Zwischen Krieg und Krise (1919–1929)'],['217–225','Info: Von der Börsenkrise zum Kollaps der Weltwirtschaft'],['226–228','Handlungsspielräume der Politik'],['229–230','Forum: Wie Experten die Ursachen erklären'],['249–252','Arbeitslos, arm, hilflos']],
 ls:['krise'],
 dossier:{
  hook:{
   zitat:'Die Weltwirtschaft ist aus den Fugen geraten. Eine Krise von solcher Dauer und Tiefe hat die Menschheit noch nie erlebt.',
   quelle:'Heinrich Brüning (Reichskanzler), Rede vor dem Reichstag, 1931',
   frage:'War der Absturz der Weimarer Republik nach dem New Yorker Börsenkrach ein unausweichliches Verhängnis oder das Resultat fataler politischer und ökonomischer Fehlentscheidungen?'
  },
  ueberblick:'Der Zusammenbruch der New Yorker Börse am 24. Oktober 1929 („Black Thursday“ bzw. in Europa „Schwarzer Freitag“) entpuppte sich als Zündschnur für den schwersten weltwirtschaftlichen Kollaps des 20. Jahrhunderts. Jahrelang war der scheinbare Aufschwung der Weimarer Republik („Goldene Zwanziger“) durch kurzfristige amerikanische Anleihen finanziert worden. Als die US-Banken infolge der heimischen Liquiditätskrise ihre Kredite über Nacht aus Deutschland abzogen, riss der transatlantische Finanzkreislauf aus Krediten, deutschen Reparationszahlungen und alliierten Kriegsschulden schlagartig ab. Überproduktion, ruinöser Protektionismus (US-Zollgesetz Smoot-Hawley 1930) und ein weltweiter Bankencrash (Zusammenbruch der Wiener Creditanstalt und der deutschen Danatbank im Sommer 1931) führten zum Schrumpfen des Welthandels um fast zwei Drittel.\n\nIn Deutschland stürzte die Krise Gesellschaft und Politik in die Katastrophe: Anfang 1932 waren über sechs Millionen Menschen offiziell arbeitslos; Millionen Familien gerieten in existenzielle Not, Verelendung und Hoffnungslosigkeit. Das politische System kollabierte parallel zur Wirtschaft: Im März 1930 zerbrach die Große Koalition unter Hermann Müller an der Frage einer minimalen Erhöhung der Arbeitslosenversicherungsbeiträge. Reichskanzler Heinrich Brüning regierte fortan mit Notverordnungen des Reichspräsidenten nach Artikel 48 der Reichsverfassung. Seine rigide Deflationspolitik – drastische Ausgabenkürzungen, Steuererhöhungen, Lohn- und Preissenkungen – sollte das Ausland von der Zahlungsunfähigkeit Deutschlands überzeugen, um die Reparationen loszuwerden. Sie wirkte jedoch krisenverschärfend (prozyklisch), entwertete das Vertrauen in die demokratischen Institutionen und trieb Millionen verzweifelter Wähler den extremistischen Rändern von KPD und vor allem der NSDAP zu.',
  abiSpotlight:{
   fokusTipp:'Für das Abitur 2027 müssen Sie die strukturellen Ursachen der Krise (US-Überproduktion, Kreditspekulation, Reparationskreislauf) sowie die fatalen Wirkungszusammenhänge (Kreditabzug → Bankenkrise → Massenarbeitslosigkeit → politische Radikalisierung) präzise rekonstruieren.',
   operatorenHinweis:'Typische Klausuraufgabe zu S3: Krisenentscheidungen in Deutschland (Brünings Deflation) und den USA (Roosevelts New Deal ab 1933 mit staatlicher Arbeitsbeschaffung und Social Security Act) vergleichend herausarbeiten und unter Berücksichtigung von Handlungsspielräumen beurteilen.',
   urteilHinweis:'Für das Sachurteil in Teilaufgabe 3 ist die Borchardt-Kontroverse der Goldstandard: Hatte Brüning angesichts von Inflationsangst (1923), Reichsbankgesetz und Reparationsfesseln keine Alternative („Zwangslage“ nach Knut Borchardt) – oder betrieb er eine politisch motivierte Verarmungsstrategie auf Kosten der Demokratie (Carl-Ludwig Holtfrerich)?'
  },
  kontroverse:{
   name:'Die Borchardt-Kontroverse: Brünings Handlungsspielräume',
   these:'Knut Borchardt (1979) postulierte, Brüning habe sich in einer unentrinnbaren „Zwangslage“ befunden: Eine expansive Konjunkturpolitik nach Vorbild Keynes sei weder finanzierbar gewesen noch hätten die Akteure die Inflationserfahrung von 1923 ignorieren können.',
   gegenposition:'Carl-Ludwig Holtfrerich und andere Historiker argumentieren, Alternativen wie staatliche Arbeitsbeschaffung (z. B. WTB-Plan der Gewerkschaften 1931/32) hätten existiert; Brüning habe die Krise bewusst verschärft, um das primäre Ziel der Reparationsstreichung durchzusetzen.'
  },
  quellen:[
   {name:'LeMO: Die Weltwirtschaftskrise 1929–1933',url:'https://www.dhm.de/lemo/kapitel/weimarer-republik/industrie-und-wirtschaft/weltwirtschaftskrise.html',institution:'Deutsches Historisches Museum'},
   {name:'bpb: Die Weltwirtschaftskrise und das Ende der Republik',url:'https://www.bpb.de/themen/zeitgeschichte/geschichte-der-weimarer-republik/169720/wirtschaft-und-gesellschaft/',institution:'Bundeszentrale für politische Bildung'},
   {name:'Bundesarchiv: Akten der Reichskanzlei – Das Kabinett Brüning',url:'https://www.bundesarchiv.de/aktenreichskanzlei/v1919-1933/0000/bru/',institution:'Bundesarchiv'}
  ]
 },
 ke:[
  {id:'IF4-S3-SK7',k:'SK',t:'erläutern Ursachen und Wirkungszusammenhänge der Weltwirtschaftskrise',
   st:['Strukturelle Ursachen: Überproduktion in Landwirtschaft und Industrie, Spekulation mit Aktien auf Kredit, ungleiche Einkommensverteilung in den USA','Auslöser: Börsenkrach in New York am 24. Oktober 1929 („Schwarzer Donnerstag“, in Europa „Schwarzer Freitag“) und 29. Oktober','Verflechtung: Kreislauf aus US-Krediten, deutschen Reparationen und alliierten Kriegsschulden; kurzfristige Kredite werden abgezogen','Protektionismus: US-Zollgesetz (Smoot-Hawley, 1930) → Welthandel schrumpft 1929–1933 um rund zwei Drittel','Bankenkrise 1931: Creditanstalt Wien (Mai), Danatbank (Juli); Großbritannien verlässt den Goldstandard (September)','Folgen in Deutschland: Anfang 1932 über 6 Mio. registrierte Arbeitslose; Verelendung, Radikalisierung, Aufstieg von NSDAP und KPD']},
  {id:'IF4-S3-UK6',k:'UK',t:'beurteilen die Bedeutung von internationalen Verflechtungen in der Zeit nach dem Ersten Weltkrieg für die Entwicklung von Krisen und Krisenbewältigungsstrategien',
   q:'Hat die internationale Verflechtung der 1920er-Jahre die Krise verschärft – oder war sie Voraussetzung der Stabilisierung?',
   pro:['Abhängigkeit von kurzfristigen US-Krediten („Scheinblüte“)','Reparationskreislauf übertrug die Krise sofort nach Europa','Protektionismus und Abwertungswettlauf pflanzten sie weltweit fort'],
   con:['Dawes-Plan (1924) und US-Kredite ermöglichten erst die Stabilisierung','Young-Plan, Hoover-Moratorium (1931) und Lausanne (1932) zeigen Kooperationsansätze','Problem war fehlende Kooperation (Kindleberger: kein stabilisierender Hegemon), nicht die Verflechtung an sich']},
  {id:'IF4-S3-UK7',k:'UK',t:'beurteilen die im Kontext der Weltwirtschaftskrise getroffenen wirtschaftlichen und politischen Krisenentscheidungen der Handelnden in Deutschland und den USA unter Berücksichtigung ihrer Handlungsspielräume',
   q:'Hatte Reichskanzler Brüning eine Alternative zur Deflationspolitik?',
   pro:['Borchardt-These (1979): kaum Spielraum – Reparationsverpflichtungen, Inflationsangst nach 1923, fehlender Kredit, Reichsbankgesetz','Brünings Ziel: Ende der Reparationen durch Nachweis der Zahlungsunfähigkeit'],
   con:['Gegenposition (u. a. Holtfrerich): Alternativen lagen vor, z. B. Arbeitsbeschaffung nach dem WTB-Plan (1931/32)','Deflation verschärfte Arbeitslosigkeit und Radikalisierung','USA: Nach Hoovers Zurückhaltung setzte Roosevelt ab 1933 mit dem New Deal auf staatliche Arbeitsbeschaffung, Bankenreform und soziale Sicherung (Social Security Act 1935)']}
 ],
 hilfe:{b:[['Deflation','Sinkendes Preisniveau; Deflationspolitik = Sparen, Steuern erhöhen, Löhne senken.'],['Protektionismus','Schutz der eigenen Wirtschaft durch Zölle und Handelsschranken.'],['Präsidialkabinett','Regierung, die sich auf das Vertrauen des Reichspräsidenten und Notverordnungen (Art. 48) stützt statt auf eine Reichstagsmehrheit.'],['New Deal','Reformprogramm Roosevelts ab 1933: Arbeitsbeschaffung, Bankenkontrolle, Sozialversicherung.']],
  s:'<b>Kreislauf-Skizze:</b> USA → Kredite → Deutschland → Reparationen → Frankreich/Großbritannien → Kriegsschulden → USA. Zeichne ein, wo der Kreislauf 1929 reißt.<br><b>Ursachen in drei Ebenen:</b> strukturell · auslösend · verstärkend.',
  f:['Die Krise wurde dadurch verstärkt, dass …','Brünings Handlungsspielraum war begrenzt durch …, zugleich hätte er …','Im Vergleich zu Deutschland reagierte die US-Regierung ab 1933 …']},
 profi:{t:'Die Borchardt-Kontroverse',x:'Knut Borchardt argumentierte 1979, Brüning habe unter „Zwangslagen“ gehandelt; eine keynesianische Politik sei weder denkbar noch finanzierbar gewesen. Kritiker wie Carl-Ludwig Holtfrerich halten dagegen, die Deflation sei auch politisch gewollt gewesen. Die Debatte eignet sich ideal für eine Erörterung mit Sach- und Werturteil.'}
},

{id:'IF5-S1', if:5, t:'Politische und ideologische Voraussetzungen des Nationalsozialismus',
 short:'Voraussetzungen des NS',
 q:'Wie war „Hitler“ möglich – scheiterte die Republik, oder siegte die NSDAP?',
 fokus:[],
 zum:[['237–248','Info: Die Weimarer Republik – eine überforderte Demokratie?'],['249–252','Arbeitslos, arm, hilflos'],['253–257','Plakate · Methode Wahlplakate (S. 254)'],['258–262','Forum: Wie war „Hitler“ möglich?'],['264 ff.','Info: NS-Ideologie und Herrschaft']],
 ls:['demokratie','krise','nation'],
 dossier:{
  hook:{
   zitat:'Die Republik ist eine Fehlgeburt gewesen, von Verrätern in die Welt gesetzt, von Schwächlingen verwaltet. Wir fordern den nationalen Aufbruch!',
   quelle:'Völkischer Beobachter, Kampfblatt der NSDAP, 1930',
   frage:'War das Scheitern der ersten deutschen Demokratie das Ergebnis einer multikausalen Strukturkrise oder des planmäßigen Angriffs antidemokratischer Eliten und Hitlers Demagogie?'
  },
  ueberblick:'Der Aufstieg des Nationalsozialismus und der Untergang der Weimarer Republik lassen sich nur durch das verhängnisvolle Ineinandergreifen langfristiger Strukturprobleme und kurzfristiger Zuspitzungen verstehen (Multikausalität und Interdependenz). Die Republik war von ihrer Geburt 1918/19 an durch die Dolchstoßlegende und den Versailler Vertrag delegitimiert. Alte Eliten in Justiz („auf dem rechten Auge blind“), Reichswehr und Verwaltung verweigerten dem parlamentarischen Staat die innere Loyalität („Republik ohne Republikaner“). Das institutionelle Notverordnungsregime nach Artikel 48, 25 und 53 der Weimarer Reichsverfassung schuf eine verfassungsrechtliche Sollbruchstelle, die das Parlament nach dem Auseinanderbrechen der Großen Koalition 1930 entbehrlich machte.\n\nDie Weltwirtschaftskrise wirkte als Radikalisierungsbeschleuniger. Die NSDAP entwickelte sich unter Ausnutzung moderner Propagandatechniken (Reichspropagandaleiter Joseph Goebbels) von einer Splitterpartei zur mit Abstand stärksten Kraft („Volkspartei mit Mittelstandsbauch“, Jürgen Falter). Der ideologische Kern des Nationalsozialismus verband pseudowissenschaftlichen Rassenantisemitismus, aggressiven Sozialdarwinismus („Kampf ums Dasein“) und den Mythos der „Volksgemeinschaft“ mit einem expansiven Kriegsprogramm zur Eroberung von „Lebensraum im Osten“. Hitler inszenierte sich im „Führermythos“ als charismatischer Erlöser über allen Parteiinteressen. Schließlich führten die autoritären Restaurationspläne der Kamarilla um Reichspräsident Paul von Hindenburg und Franz von Papen am 30. Januar 1933 zur Übertragung der Kanzlerschaft an Hitler – in der fatalen Illusion, man habe den „Böhmischen Gefreiten“ innerhalb eines konservativen Kabinetts „eingerahmt“ und „an die Wand gedrückt“.',
  abiSpotlight:{
   fokusTipp:'LK-Abiturrelevanz: Beherrschen Sie das Ursachenbündel für das Scheitern der Republik (Versailler Hypothek, institutionelle Webfehler der Verfassung, Mentalitäten, sozioökonomischer Schock, autoritäre Intrigen). Setzen Sie die Kernelemente der NS-Ideologie zueinander in Beziehung.',
   operatorenHinweis:'Bei der Analyse historischer Reden und Flugschriften (AFB I/II) muss die NS-Sprache (LTI – Lingua Tertii Imperii nach Victor Klemperer) dekonstruiert werden: Biologismen („Volkskörper“, „Parasiten“), Euphemismen („Bereinigung“) und religiöses Pathos („Vorsehung“).',
   urteilHinweis:'Im Anforderungsbereich III ist die Dichotomie zwischen Struktur und Individuum zentral: War Hitler lediglich die Vollzugskraft struktureller Krisenprozesse, oder war seine Person und charismatische Herrschaft der unverzichtbare Katalysator des Totalitarismus?'
  },
  kontroverse:{
   name:'Strukturen vs. Persönlichkeit / Machtzerfall vs. Machtübertragung',
   these:'Karl Dietrich Bracher (1955) interpretierte die Machtergreifung als stufenweisen Prozess von Machtverfall, Machtvakuum und skrupelloser Machtaneignung durch die NS-Führung.',
   gegenposition:'Strukturgeschichtliche Ansätze (u. a. Hans-Ulrich Wehler) betonen den autoritären deutschen „Sonderweg“ und die Rolle der traditionellen Eliten, während Ian Kershaw das Konzept des „dem Führer Entgegenarbeitens“ entwickelte, bei dem Hitler als charismatischer Fixpunkt fungierte, die Radikalisierungsdynamik jedoch von bürokratischen und gesellschaftlichen Apparaten getrieben wurde.'
  },
  quellen:[
   {name:'LeMO: Das Ende der Weimarer Republik und NS-Aufstieg',url:'https://www.dhm.de/lemo/kapitel/weimarer-republik/innenpolitik/ende.html',institution:'Deutsches Historisches Museum'},
   {name:'bpb: Dossier Nationalsozialismus – Ideologie und Weg zur Macht',url:'https://www.bpb.de/themen/nationalsozialismus-zweiter-weltkrieg/dossier-nationalsozialismus/',institution:'Bundeszentrale für politische Bildung'},
   {name:'Institut für Zeitgeschichte (IfZ München): Zeitgeschichte online – NS-Forschung',url:'https://www.ifz-muenchen.de/',institution:'Institut für Zeitgeschichte'}
  ]
 },
 ke:[
  {id:'IF5-S1-SK1',k:'SK',t:'erklären unter der Perspektive von Multikausalität und Interdependenz lang- und kurzfristige Gründe für das Scheitern der Weimarer Republik sowie deren Zusammenhang mit dem Aufstieg der NSDAP',
   st:['Langfristig: Versailler Vertrag und Dolchstoßlegende als Hypothek; obrigkeitsstaatliche Traditionen; antidemokratische Eliten in Reichswehr, Justiz, Verwaltung („Republik ohne Republikaner“)','Verfassung: Machtdreieck des Reichspräsidenten aus Art. 48 (Notverordnung), Art. 25 (Reichstagsauflösung), Art. 53 (Kanzlerernennung)','Wirtschaft: Inflation 1923 entwertet Ersparnisse des Mittelstands; Weltwirtschaftskrise 1929 → Massenarbeitslosigkeit','Politisch: Bruch der Großen Koalition (März 1930) → Präsidialkabinette Brüning, Papen, Schleicher; Reichstag entmachtet','NSDAP-Wahlergebnisse: 1930 18,3 % · Juli 1932 37,3 % · November 1932 33,1 %','NSDAP als „Volkspartei mit Mittelstandsbauch“ (Jürgen Falter): Wähler aus allen Schichten, überdurchschnittlich protestantisch, ländlich, mittelständisch','Kurzfristig: Intrigen um Hindenburg (Papen, Oskar von Hindenburg) → Ernennung Hitlers am 30. Januar 1933','Interdependenz: Wirtschaftskrise verstärkt Radikalisierung, Radikalisierung lähmt das Parlament, das stärkt den Präsidenten']},
  {id:'IF5-S1-SK2',k:'SK',t:'erläutern wesentliche Elemente der NS-Ideologie, deren Ursprünge und Funktion im Herrschaftssystem',

  {id:'IF5-S1-SK3',k:'SK',t:'erläutern den ideologischen Charakter des nationalsozialistischen Sprachgebrauchs',
   st:['Verschleierung durch Euphemismen: „Endlösung“, „Sonderbehandlung“, „Evakuierung“','Biologismen und Entmenschlichung: „Volkskörper“, „Schädlinge“, „Parasiten“','Pathos und Superlative: „ewig“, „total“, „einmalig“; Sakralisierung: „Glaube“, „Vorsehung“','Victor Klemperer, „LTI – Lingua Tertii Imperii“ (1947): Sprache als Gift, das unbemerkt wirkt','Funktion: Emotionalisierung, Abstumpfung, Tarnung von Verbrechen','Für die Klausur: NS-Begriffe immer in Anführungszeichen und kritisch einordnen']},
  {id:'IF5-S1-UK2',k:'UK',t:'beurteilen Kontinuitäten und Diskontinuitäten von Denkmustern und Wertesystemen am Beispiel der NS-Ideologie',
   q:'War die NS-Ideologie etwas Neues?',
   pro:['Kontinuität: völkischer Nationalismus, Antisemitismus, Sozialdarwinismus, Kolonialrassismus seit dem 19. Jahrhundert','Revisionismus und Militarismus knüpfen an Kaiserreich und Weltkrieg an'],
   con:['Diskontinuität: Radikalisierung bis zum staatlich organisierten Völkermord','Bruch mit Rechtsstaat und Aufklärung: „Zivilisationsbruch“ (Dan Diner)','Totaler Anspruch auf den ganzen Menschen']},
  {id:'IF5-S1-UK3',k:'UK',t:'erörtern am Beispiel des Nationalsozialismus die Bedeutung von Strukturen und Einzelpersonen in der Geschichte',

   con:['Strukturen: Wirtschaftskrise, Verfassungsmängel, konservative Eliten, gesellschaftliche Mentalitäten','Hitler kam durch Machtübertragung (Hindenburg, Papen) ins Amt, nicht allein aus eigener Kraft','Polykratie: Dynamik vieler konkurrierender Instanzen']}
 ],

  f:['Langfristig belastete … die Republik, weil …; kurzfristig verschärfte sich dies durch …','Die Faktoren bedingten sich gegenseitig: …','Entscheidend war nicht ein einzelner Faktor, sondern …']},
 profi:{t:'Machtverfall oder Machtübertragung?',x:'Karl Dietrich Bracher beschrieb 1955 die „Auflösung der Weimarer Republik“ als Prozess von Machtverlust, Machtvakuum und Machtergreifung. Neuere Arbeiten betonen die Verantwortung der Handelnden um Hindenburg im Januar 1933. Prüfe, welche Rolle Zufall und Entscheidung in beiden Erklärungen spielen.'}

{id:'IF5-S2', if:5, t:'Die Herrschaft des Nationalsozialismus in Deutschland und Europa',
 short:'NS-Herrschaft in Deutschland und Europa',
 q:'Verführung oder Gewalt – worauf beruhte die Herrschaft des Nationalsozialismus?',
 fokus:['Wirtschaftspolitik','Motive und Formen der Unterstützung, der Anpassung und des Widerstandes am Beispiel der Verschwörer des 20. Juli und an einem Beispiel der Jugendopposition'],
 zum:[['264–281','Info: Sicherung der Macht und totalitäre Herrschaft'],['282–287','Wels und Hitler zum „Ermächtigungsgesetz“ · Methode Rede (S. 283)'],['288–300','„Führerstaat“ · „Führermythos“ · Methode Fotografien (S. 292)'],['301–307','Forum: „Verführung und Gewalt“'],['309–325','Info: Zweiter Weltkrieg und Steigerung der Diktatur'],['326–336','„Völkische Wirtschaft“ · Außenpolitik 1933–1939'],['337–350','Konzentrations- und Vernichtungslager · Filme über den Holocaust'],['351–357','Militärischer Widerstand (Jugendopposition: kein eigenes Kapitel, siehe Stichworte)']],
 ls:['demokratie','nation'],
 dossier:{
  hook:{
   zitat:'Man kann eine Diktatur nicht mit Worten bekämpfen, sondern nur mit der Tat. Die Tat aber verlangt Opfer.',
   quelle:'Henning von Tresckow vor dem Attentat vom 20. Juli 1944',
   frage:'War das NS-Regime ein monolithischer Führerstaat oder ein chaotisches Machtgefüge – und wie verhielten sich Verführung, Terror, Anpassung und Widerstand in der Praxis?'
  },
  ueberblick:'Binnen weniger Monate nach dem 30. Januar 1933 errichteten die Nationalsozialisten ein totalitäres Herrschaftssystem. Die Reichstagsbrandverordnung vom 28. Februar 1933 setzte die elementaren Grundrechte dauerhaft außer Kraft; das Ermächtigungsgesetz vom 24. März besiegelte die Selbstentmachtung des Parlaments. Durch die systematische „Gleichschaltung“ wurden Bundesstaaten, Gewerkschaften und Parteien zerschlagen, Presse und Kultur zensiert und der Einparteienstaat gesetzlich zementiert. Die Herrschaft stützte sich auf ein dichtes Netz aus offenem Terror (SA, SS, Geheime Staatspolizei, Konzentrationslager ab Dachau 1933) und massenwirksamer Propaganda (Goebbels). Zugleich offenbarte das Regime keineswegs stringente Effizienz, sondern eine polykratische Herrschaftsstruktur: Konkurrierende staatliche, parteiamtliche und sonderbevollmächtigte Instanzen trieben eine „kumulative Radikalisierung“ voran, indem sie versuchten, dem antizipierten Willen Hitlers „entgegenzuarbeiten“ (Ian Kershaw).\n\nDie Wirtschaftspolitik täuschte durch großangelegte Arbeitsbeschaffung und Prestigeprojekte (Autobahnbau) eine gesunde Prosperität vor; in Wahrheit war sie von Beginn an auf bedingungslose Kriegsfähigkeit ausgerichtet. Hjalmar Schachts Mefo-Wechsel schufen eine gigantische verdeckte Staatsverschuldung; der Vierjahresplan von 1936 unter Hermann Göring unterwarf die Wirtschaft dem Ziel totaler militärischer Autarkie („Kanonen statt Butter“). Die aggressive Außenpolitik riss die Fesseln von Versailles Schritt für Schritt nieder und mündete am 1. September 1939 im rassenideologischen Zweiten Weltkrieg. Im Rücken der Wehrmacht vollzog sich der beispiellose Zivilisationsbruch der Shoah: Von den Nürnberger Gesetzen 1935 über die Novemberpogrome 1938 und die Massenerschießungen der Einsatzgruppen ab 1941 bis zur fabrikmäßigen Vernichtung in Auschwitz, Treblinka und Belzec wurden rund sechs Millionen europäische Jüdinnen und Juden sowie Hunderttausende Sinti und Roma, Homosexuelle und Behinderte planmäßig ermordet.\n\nDas Verhalten der Bevölkerung reichte von fanatischer Unterstützung und Denunziation über opportunistisches Mitläufertum bis hin zu Verweigerung und Resistenz. Widerstand formierte sich unter extremen Bedingungen: Der militärisch-zivile Umsturzversuch vom 20. Juli 1944 (Stauffenberg, Goerdeler, Beck) scheiterte knapp; zugleich bewiesen Gruppen der Jugendopposition wie die Münchner Weiße Rose (Geschwister Scholl) oder die rheinisch-westfälischen Edelweißpiraten sowie Einzeltäter wie Georg Elser den Mut zum Gewissensentscheid gegen das Terrorregime.',
  abiSpotlight:{
   fokusTipp:'LK-Fokussierung 2027: Analysieren Sie die NS-Wirtschaftspolitik im Widerspruch zwischen öffentlicher Propaganda („Wirtschaftswunder“) und realer Kriegsfinanzierung/Ausbeutung. Vertiefen Sie den Widerstand am Beispiel des 20. Juli 1944 (Motive, Dilemmata, Zukunftspläne) und der Jugendopposition (Nonkonformität, Flugblattaktionen der Weißen Rose, Edelweißpiraten in Köln-Ehrenfeld).',
   operatorenHinweis:'Beim Erläutern des Zusammenhangs von Vernichtungskrieg und Völkermord (AFB II) sind die verbrecherischen Befehle (Kommissarbefehl, Generalplan Ost) und die Eskalation vom Ausgrenzungs- zum Ausrottungsprogramm (Wannsee-Konferenz 1942) quellengestützt darzulegen.',
   urteilHinweis:'Für das Sach- und Werturteil über Widerstand: Kriterien offenlegen (Motive, Mittel, Zeitpunkt, Risikobereitschaft, Erfolgsaussicht, ethischer Wertmaßstab). Würdigen Sie den Widerstand als unvergängliche ethische Tat, ohne die autoritären Teilaspekte konservativer Planungen zu verschweigen.'

{id:'IF5-S3', if:5, t:'Vergangenheitspolitik und „Vergangenheitsbewältigung“',
 short:'Vergangenheitspolitik',
 q:'Aufarbeitung oder Verdrängung – wie gingen die Deutschen nach 1945 mit dem Nationalsozialismus um?',
 fokus:['Umgang mit dem Nationalsozialismus in den Besatzungszonen'],
 zum:[['359–363','Info: „Der Zivilisationsbruch“ – Erklärungsansätze'],['364–368','Forum: Ein deutscher „Sonderweg“?'],['369–375','Forum: Historische Verantwortung und Identität nach 1945'],['419–425','Info: Vergangenheitspolitik und „Vergangenheitsbewältigung“'],['426–431','Die Praxis der Entnazifizierung in Ost und West'],['432–445','Gedenkstätte Buchenwald · Erinnerungskultur heute']],
 ls:['demokratie'],
 dossier:{
  hook:{
   zitat:'Wer vor der Vergangenheit die Augen verschließt, wird blind für die Gegenwart. Wer sich der Unmenschlichkeit nicht erinnern will, der wird wieder anfällig für neue Ansteckungsgefahren.',
   quelle:'Bundespräsident Richard von Weizsäcker, Rede im Deutschen Bundestag zum 8. Mai 1985',
   frage:'War der Umgang der Deutschen mit der NS-Hinterlassenschaft nach 1945 ein Prozess ehrlicher Vergangenheitsbewältigung oder eine jahrzehntelange Politik der Verdrängung und Amnestie?'
  },
  ueberblick:'Nach der bedingungslosen Kapitulation der Wehrmacht am 8. Mai 1945 stand Deutschland vor den Trümmern des „Zivilisationsbruchs“ (Dan Diner). Das Potsdamer Abkommen der Alliierten (August 1945) formulierte die „vier großen D“: Denazifizierung, Demilitarisierung, Dezentralisierung und Demokratisierung. Doch die Umsetzung der Entnazifizierung geriet in den vier Besatzungszonen zur Zerreißprobe. Während der Nürnberger Hauptkriegsverbrecherprozess (1945/46) die oberste Führung juristisch zur Rechenschaft zog und völkerrechtliche Meilensteine (Verbrechen gegen die Menschlichkeit, Verbrechen gegen den Frieden) setzte, scheiterte die Massenentnazifizierung an der schieren Zahl von Millionen Betroffenen. In den Westzonen, insbesondere in der US-Zone mit ihren 131 Fragen umfassenden Meldebögen, mündete die Übergabe an deutsche Laienspruchkammern in eine regelrechte „Mitläuferfabrik“ (Lutz Niethammer), bei der gegenseitige Entlastungszeugnisse („Persilscheine“) millionenfache Rehabilitierung ermöglichten. In der sowjetischen Besatzungszone (SBZ) wiederum diente die Säuberung von Alt-Nazis zugleich als Hebel für den radikalen Elitenaustausch, Enteignungen (Bodenreform) und den stalinistischen Umbau zur Diktatur, bevor sie 1948 abrupt für beendet erklärt wurde.\n\nIn den 1950er-Jahren dominierte in der Bundesrepublik Deutschland unter Bundeskanzler Konrad Adenauer eine staatlich organisierte „Vergangenheitspolitik“ (Norbert Frei), die durch weitreichende Straffreiheitsgesetze (Amnestien 1949/1954) und das 131er-Gesetz die Reintegration selbst schwer belasteter NS-Funktionäre in Justiz, Verwaltung und Universitäten betrieb. Hermann Lübbe deutete dieses „kommunikative Beschweigen“ später als notwendigen Preis für die Stabilisierung der jungen Demokratie. Erst die 1960er-Jahre brachten eine dramatische Wende: Der Ulmer Einsatzgruppenprozess (1958), der Eichmann-Prozess in Jerusalem (1961), die Frankfurter Auschwitz-Prozesse (1963–1965 unter Generalstaatsanwalt Fritz Bauer) und der Protest der 68er-Bewegung brachen die Mauer des Schweigens. Die DDR hingegen verordnete einen doktrinären „Antifaschismus von oben“, der die Schuld an der NS-Barbarei einseitig dem kapitalistischen Westen zuwies und die eigene Bevölkerung exkulpierte. Heute bildet eine selbstkritische, pluralistische Erinnerungskultur (Stolpersteine, Holocaust-Mahnmal in Berlin, Gedenktag 27. Januar) ein unverrückbares Fundament des demokratischen Verfassungskonsenses.',
  abiSpotlight:{
   fokusTipp:'LK-Fokussierung 2027: Beherrschen Sie den vergleichenden Umgang mit dem NS in den Besatzungszonen. Vergleichen Sie Zielsetzungen, Instrumente (Spruchkammern vs. Speziallager/Säuberungen) und Ergebnisse in US-, britischer, französischer und sowjetischer Zone.',
   operatorenHinweis:'Beim Operator „erörtern von Erklärungsansätzen“ (AFB III) müssen Theoriemodelle (Totalitarismustheorie nach Hannah Arendt, Faschismustheorie, Sonderwegsthese von Wehler/Nipperdey) auf ihre Erklärungskraft und ihre Grenzen geprüft werden.',
   urteilHinweis:'Für die Beurteilung kollektiver Erinnerungsformen: Analysieren Sie Denkmäler und Gedenktage nach Funktion, Akteuren, Adressaten und Auslassungen. Diskutieren Sie das Spannungsverhältnis zwischen ritualisiertem Gedenken und lebendiger historisch-politischer Urteilsbildung.'
  },
  kontroverse:{
   name:'„Kommunikatives Beschweigen“ (Hermann Lübbe) vs. „Vergangenheitspolitik“ (Norbert Frei)',
   these:'Hermann Lübbe (1983) verteidigte die frühe bundesdeutsche Verdrängungspraxis: Das wechselseitige Schweigen habe ehemaligen NS-Anhängern die psychologische Integration in die Demokratie ermöglicht und die Republik gegen Radikalisierung abgesichert.',
   gegenposition:'Norbert Frei (1996) weist nach, dass die Vergangenheitspolitik der 1950er-Jahre eine gezielte Begünstigungspolitik für Täter war, die den Opfern Gerechtigkeit verweigerte und die moralische Glaubwürdigkeit des Rechtsstaats schwer beschädigte.'
  },
  quellen:[
   {name:'bpb: Entnazifizierung und Vergangenheitspolitik',url:'https://www.bpb.de/themen/nachkriegszeit/geschichte-der-weimarer-republik/145326/entnazifizierung/',institution:'Bundeszentrale für politische Bildung'},
   {name:'Stiftung Haus der Geschichte: Vergangenheitspolitik in Ost und West',url:'https://www.hdg.de/lemo/kapitel/nachkriegsjahre/entnazifizierung-und-antifaschismus.html',institution:'Haus der Geschichte der Bundesrepublik Deutschland'},
   {name:'Bundesarchiv: Themenportal Entnazifizierung',url:'https://www.bundesarchiv.de/DE/Content/Virtuelle-Ausstellungen/Entnazifizierung/entnazifizierung.html',institution:'Bundesarchiv'}
  ]

 ke:[

   st:['Potsdamer Abkommen (August 1945): Entmilitarisierung, Entnazifizierung, Dezentralisierung, Demokratisierung (dazu Demontage)','Nürnberger Hauptkriegsverbrecherprozess 1945/46 (zwölf Todesurteile) und Nachfolgeprozesse','US-Zone: Fragebogen mit 131 Fragen, ab 1946 deutsche Spruchkammern, fünf Kategorien (Hauptschuldige bis Entlastete); „Persilscheine“ – die „Mitläuferfabrik“ (Lutz Niethammer)','Britische Zone: pragmatischer, Funktionsfähigkeit der Verwaltung im Vordergrund; Umerziehung („re-education“)','Französische Zone: zunächst streng, dann uneinheitlich und pragmatisch','Sowjetische Zone: radikaler Austausch von Justiz- und Lehrerpersonal, Enteignungen (Bodenreform 1945), Speziallager (z. B. Buchenwald 1945–1950); Entnazifizierung zugleich Instrument der Sowjetisierung, 1948 für beendet erklärt','Kalter Krieg: ab 1948 Abschluss der Entnazifizierung in den Westzonen','Teilstaaten: BRD – Amnestien (1949, 1954), Wiedereinstellung belasteter Beamter (Art. 131 GG), Wiedergutmachung (Luxemburger Abkommen 1952), Ulmer Einsatzgruppenprozess und Zentrale Stelle Ludwigsburg (1958), Frankfurter Auschwitz-Prozesse (1963–1965); DDR – Antifaschismus als Staatsdoktrin, Waldheimer Prozesse (1950), Verantwortung dem Westen zugeschrieben']},
  {id:'IF5-S3-UK6',k:'UK',t:'erörtern die Stichhaltigkeit und Aussagekraft von unterschiedlichen Erklärungsansätzen zum Nationalsozialismus in historischen Darstellungen oder Debatten',

   con:['Totalitarismustheorie: blendet Unterschiede der Ideologien aus; im Kalten Krieg politisch genutzt','Faschismustheorien (marxistisch: Diktatur des Finanzkapitals): vernachlässigen Rassenideologie und Massenzustimmung','Sonderweg: Kritik von Blackbourn/Eley – welcher „Normalweg“ ist der Maßstab?']},
  {id:'IF5-S3-UK7',k:'UK',t:'beurteilen, unter Beachtung der jeweiligen Perspektive, verschiedene historische Formen der kollektiven Erinnerung an die NS-Gewaltherrschaft, den Holocaust sowie die Verfolgung und Vernichtung von Minderheiten und Andersdenkenden',

   con:['DDR: Nationale Mahn- und Gedenkstätte Buchenwald (1958) stellte kommunistischen Widerstand heraus, jüdische Opfer blieben am Rand','BRD: lange Schlussstrich-Mentalität; Ritualisierung heutiger Gedenkformen','Kriterien: Opferperspektive · Benennung der Täter · Funktion für die Gegenwart']}

   frage:'Wandelte sich der deutsche Nationalismus von einer freiheitlichen Emanzipationsbewegung zu einem autoritären Ausgrenzungsinstrument – und wie ebnete dies den Weg zum rassistischen Totalitarismus des NS-Regimes?'
  },
  ueberblick:'Die Reichsgründung von 1871 vollzog sich nicht als Verwirklichung der demokratischen Ideale der Paulskirche, sondern als „Revolution von oben“ unter preußischer Hegemonie. Nach den drei siegreichen Einigungskriegen (1864 gegen Dänemark, 1866 gegen Österreich, 1870/71 gegen Frankreich) proklamierten die deutschen Fürsten am 18. Januar 1871 im Spiegelsaal von Versailles das Deutsche Kaiserreich. Die von Bismarck maßgeschneiderte Reichsverfassung begründete eine konstitutionelle Monarchie mit stark obrigkeitsstaatlichen Zügen: Zwar verfügte der Reichstag über das allgemeine, gleiche Männerwahlrecht und das Budgetrecht, doch der Reichskanzler war allein dem Monarchen verantwortlich, und das Militär bildete eine parlamentarisch unkontrollierte Macht im Staate.\n\nMit der Reichsgründung vollzog sich ein fundamentaler Funktionswandel des Nationalismus: Aus der liberal-progressiven Oppositionsbewegung des Vormärz wurde ein staatstragender, aggressiv nach außen und innen gerichteter „Reichsnationalismus“. Da die Reichseinheit institutionell fragil blieb, betrieb Bismarck eine Politik der „negativen Integration“ durch die Konstruktion innerer Feindbilder. Im sogenannten „Kulturkampf“ (ab 1871/72) bekämpfte der Staat den politischen Katholizismus (Zentrumspartei) als ultramontane, reichsfeindliche Kraft; mit dem Sozialistengesetz (1878–1890) wurde die organisierte Arbeiterbewegung als „vaterlandslose Gesellen“ diffamiert und polizeilich verfolgt. Beide Maßnahmen verfehlten ihr Ziel: Zentrum und SPD gingen gestärkt aus den Konflikten hervor. Im Wilhelminismus radikalisierte sich der Nationalismus weiter: Verbände wie der Alldeutsche Verband (1891) und der Deutsche Flottenverein verknüpften imperiale Weltmachtansprüche mit völkischem und antisemitischem Gedankengut.\n\nUnter der nationalsozialistischen Diktatur (1933–1945) erreichte dieser Prozess seinen extremen Zivilisationsbruch. Der Begriff der Nation wurde radikal biologisiert und auf die rassistische Konstruktion der „Volksgemeinschaft“ verengt. Diese diente als doppelgesichtiges Instrument: Einerseits erzeugte sie nach innen hohe Integrations- und Mobilisierungskraft durch soziale Gleichheitsversprechen, Massenorganisationen (HJ, BDM, DAF) und NS-Gemeinschaftsrituale; andererseits bedeutete sie die absolute, gewaltsame Ausgrenzung, Entrechtung und physische Vernichtung all jener, die als „Gemeinschaftsfremde“ oder rassenideologische Feinde definiert wurden (Jüdinnen und Juden, Sinti und Roma, politisch Andersdenkende, Homosexuelle, Behinderte). Der aggressive Ultranationalismus gipfelte im rassenideologischen Vernichtungskrieg und dem Menschheitsverbrechen der Shoah.',

   fokusTipp:'Für das Abitur 2027: Analysieren Sie den Funktionswandel des Nationalismus im diachronen Längsschnitt. Vergleichen Sie die liberale Integrationsidee von 1848 mit der „negativen Integration“ im Kaiserreich und der biologisch-rassistischen „Volksgemeinschaft“ im NS-Regime.',

   gegenposition:'Thomas Nipperdey plädierte für eine differenzierte Sichtweise: Das Kaiserreich sei ein Staat „mit vielen Gesichtern“ gewesen, der neben autoritären Zügen eine hochdynamische Modernität in Wirtschaft, Kultur, Wissenschaft, Rechtsstaatlichkeit und parlamentarischer Parteikultur aufwies.'
  },

 },

   zitat:'Die Bundesrepublik Deutschland und die Deutsche Demokratische Republik werden normale gutnachbarliche Beziehungen zueinander auf der Grundlage der Gleichberechtigung entwickeln […] Sie gehen von dem Grundsatz aus, dass die Hoheitsgewalt jedes der beiden Staaten sich auf sein Staatsgebiet beschränkt.',

   frage:'War die deutsche Zweistaatlichkeit ein zementiertes Produkt des Kalten Krieges oder boten historische Schnittstellen wie die Stalinnote 1952 oder die Neue Ostpolitik echte Handlungsspielräume für nationale Selbstbestimmung?'
  },
  ueberblick:'Nach der bedingungslosen Kapitulation der Wehrmacht am 8. Mai 1945 und den Beschlüssen der Potsdamer Konferenz (vier D: Denazifizierung, Demilitarisierung, Dezentralisierung, Demokratisierung) wurde Deutschland zum zentralen Schauplatz des heraufziehenden Kalten Krieges. Truman-Doktrin, Marshall-Plan und die Währungsreform in den Westzonen 1948 führten zur sowjetischen Berlin-Blockade und besiegelten die Teilung. Im Mai 1949 konstituierte sich die Bundesrepublik Deutschland mit dem Grundgesetz als freiheitliche, parlamentarische Demokratie; im Oktober 1949 folgte die Gründung der DDR als sozialistischer Vasallenstaat unter der Hegemonie der SED. Beide Staaten rangen fortan um nationale Legitimität: Die Bundesrepublik beanspruchte unter Konrad Adenauer das Alleinvertretungsrecht für ganz Deutschland und verankerte im Grundgesetz ein verbindliches Wiedervereinigungsgebot, während sie über die Hallstein-Doktrin versuchte, die DDR international zu isolieren.\n\nEinen dramatischen Wendepunkt markierte die Stalinnote vom 10. März 1952: Josef Stalin unterbreitete den drei Westmächten den Vorschlag für Friedensverhandlungen über ein wiedervereinigtes, neutrales Deutschland mit eigener nationaler Verteidigungsarmee. Die Bundesregierung unter Adenauer wies die Note in enger Abstimmung mit den Westmächten zurück. Für Adenauer hatte die Westbindung (Beitritt zu Montanunion, EVG-Verhandlungen und 1955 NATO) absoluten Vorrang vor einer Neutralisierung, die er als sowjetische Falle zur Destabilisierung Westeuropas bewertete („Freiheit geht vor Einheit“). Mit dem Mauerbau am 13. August 1961 schien die Teilung endgültig zementiert. Die DDR tilgte in ihrer Verfassungsrevision von 1974 gar den Begriff der „deutschen Nation“ und definierte sich fortan als eigener „sozialistischer Staat der Arbeiter und Bauern“.\n\nEnde der 1960er Jahre leitete die sozial-liberale Koalition unter Willy Brandt und Walter Scheel einen radikalen Paradigmenwechsel ein: die Neue Ostpolitik unter der Leitformel Egon Bahrs „Wandel durch Annäherung“ (1963). Durch den Moskauer und Warschauer Vertrag (1970, Kniefall von Warschau als historisches Zeichen der Bitte um Vergebung), das Viermächteabkommen über Berlin (1971) und den Grundlagenvertrag (1972) akzeptierte die Bundesrepublik den territorialen Status quo und die Oder-Neiße-Grenze, ohne jedoch den völkerrechtlichen Anspruch auf eine friedliche Wiedervereinigung aufzugeben („Brief zur deutschen Einheit“). Die Ostverträge und der anschließende KSZE-Prozess von Helsinki (1975) brachten entscheidende humanitäre Erleichterungen für Millionen Menschen und stärkten die Bürgerrechtsbewegungen in ganz Osteuropa.',

{id:'IF6-S4', if:6, t:'Die Überwindung der deutschen Teilung in der friedlichen Revolution von 1989',
 short:'Friedliche Revolution 1989/90',
 q:'Revolution, Zusammenbruch oder Geschenk der Weltpolitik – wie kam es 1989/90 zur Einheit?',
 fokus:[],
 zum:[['502–517','Info: Ende des Ost-West-Konflikts, „Friedliche Revolution“, deutsche Einheit'],['518–526','Staat und Bevölkerung 1989 · Debatte um die Einheit 1989/90'],['527–535','Deutsche Befindlichkeiten nach 1990 · Forum: Zusammenbruch oder Revolution?']],

 dossier:{
  hook:{
   zitat:'Für den Fall, dass Schutzpolizei und Kampfgruppen massiv vorgehen, sind wir zu allem entschlossen! Wir fordern freien Dialog über die Zukunft unseres Landes!',
   quelle:'Aufruf Leipziger Bürger und Oppositioneller vor der entscheidenden Demonstration, 9. Oktober 1989',
   frage:'War der Fall der Berliner Mauer und die deutsche Wiedervereinigung primär das heroische Werk einer friedlichen Bürgerrevolution oder das zwangsläufige Resultat des ökonomischen Zusammenbruchs der Sowjetunion?'
  },
  ueberblick:'Die Überwindung der deutschen Teilung im Herbst 1989 gehört zu den erstaunlichsten Umbrüchen der Weltgeschichte. Sie vollzog sich im hochkomplexen Zusammenspiel von innerer Systemkrise der DDR, mutigem zivilgesellschaftlichem Protest und tiefgreifendem weltpolitischen Wandel. Seit dem Amtsantritt von Michail Gorbatschow 1985 in Moskau veränderten Glasnost (Offenheit) und Perestroika (Umbau) das sowjetische Imperium; mit der Aufgabe der Breschnew-Doktrin erhielten die Warschauer-Pakt-Staaten das Recht auf eigene Wege. Während in Polen (Solidarność am Runden Tisch) und Ungarn Reformen griffen, verweigerte die erstarrte SED-Führung unter Erich Honecker jeden Kurswechsel („Tapeten-Vergleich“ von Kurt Hager).\n\nIm Frühjahr 1989 eskalierte die Krise: Die offensichtliche Fälschung der DDR-Kommunalwahlen am 7. Mai 1989 löste offene Empörung aus. Gleichzeitig suchten Zehntausende über die bundesdeutschen Botschaften in Prag und Warschau sowie über das am 2. Mai eröffnete Paneuropäische Picknick in Ungarn einen Ausweg in den Westen. In der DDR formierten sich oppositionelle Bürgerbewegungen (Neues Forum, Demokratie Jetzt, SDP). Das entscheidende Fanal bildete der 9. Oktober 1989 in Leipzig: Trotz massiver Drohungen der Staatsmacht mit einer „chinesischen Lösung“ (Massaker auf dem Platz des Himmlischen Friedens) zogen über 70.000 Menschen mit dem Ruf „Wir sind das Volk!“ und „Keine Gewalt!“ friedlich über den Ring. Die SED-Führung kapitulierte vor der schieren Masse; Honecker wurde am 18. Oktober durch Egon Krenz gestürzt. Nach der historischen Großdemonstration auf dem Berliner Alexanderplatz am 4. November führte eine missverständliche Pressekonferenz von Günter Schabowski am 9. November 1989 zum spontanen Ansturm auf die Grenzübergänge und zum Fall der Berliner Mauer.\n\nDer Weg zur staatlichen Einheit beschleunigte sich rasch. Die Parole der Massen wandelte sich von „Wir sind das Volk!“ zu „Wir sind ein Volk!“. Am Zentralen Runden Tisch verhandelten Bürgerrechtler und Übergangsregierung; Helmut Kohl präsentierte am 28. November 1989 überraschend sein Zehn-Punkte-Programm für eine bundesstaatliche Ordnung. Nach dem überwältigenden Sieg der bürgerlichen „Allianz für Deutschland“ bei den ersten freien Volkskammerwahlen am 18. März 1990 folgten im Sommer die Wirtschafts-, Währungs- und Sozialunion (1. Juli 1990). International gelang Bundeskanzler Kohl und Außenminister Genscher im Kaukasus-Gespräch mit Gorbatschow der Durchbruch: Die UdSSR stimmte der NATO-Mitgliedschaft des vereinten Deutschlands zu. Am 12. September 1990 besiegelte der Zwei-plus-Vier-Vertrag die volle außenpolitische Souveränität Deutschlands. Mit dem Beitritt der fünf neu gegründeten Länder nach Artikel 23 des Grundgesetzes vollendete sich am 3. Oktober 1990 die deutsche Wiedervereinigung.',
  abiSpotlight:{
   fokusTipp:'Für das Abitur 2027: Analysieren Sie das Zusammenspiel nationaler (Fluchtbewegung, Bürgerrechtsgruppen, Leipziger Montagsdemonstrationen) und internationaler Faktoren (Gorbatschows Reformpolitik, Zwei-plus-Vier-Verhandlungen, Haltung von Bush, Thatcher und Mitterrand).',
   operatorenHinweis:'Beim Operator „vergleichen/erklären“ (AFB II): Arbeiten Sie die divergierenden Motive der Akteure heraus – die ursprüngliche Vision der Bürgerrechtler von einer demokratisierten, eigenständigen DDR („Dritter Weg“) versus den Wunsch der breiten Bevölkerung nach schneller Währungsunion und Wohlstand.',
   urteilHinweis:'Für die Urteilsbildung (AFB III): Reflektieren Sie die Begriffswahl „Friedliche Revolution“ versus „Zusammenbruch/Implosion“ oder „Beitritt/Anschluss“ als Ausdruck unterschiedlicher geschichtspolitischer Deutungsmuster.'

   frage:'Begründete der Westfälische Frieden von 1648 tatsächlich das moderne, säkulare Staatensystem souveräner Nationen – oder war er in erster Linie eine pragmatische Verfassungs- und Rechtsordnung zur Einhegung des Alten Reiches?'
