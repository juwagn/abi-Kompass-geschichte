  ueberblick:'Der Dreißigjährige Krieg (1618–1648) begann mit dem Prager Fenstersturz als regionaler böhmischer Ständeaufstand gegen die katholische Rekatholisierungspolitik der Habsburger und eskalierte rasch zu einem verheerenden gesamteuropäischen Großkonflikt. Auf deutschem Boden überlagerten sich konfessionelle Gegensätze (Katholiken, Lutheraner, Reformierte), reichsverfassungsrechtliche Machtkämpfe zwischen dem kaiserlichen Universalanspruch und der „teutschen Libertät“ der Reichsstände sowie die geostrategische Hegemonialrivalität zwischen den Bourbonen (Frankreich) und den Habsburgern (Spanien und Kaiser). Mit dem Eingreifen Schwedens (1630) und Frankreichs (1635) trat das konfessionelle Moment zunehmend hinter nackter Staatsräson zurück: Das katholische Frankreich unter Kardinal Richelieu paktierte offen mit protestantischen Fürsten gegen die katholische Vormacht Habsburg. Für die Bevölkerung im Heiligen Römischen Reich bedeutete der Krieg eine humanitäre Katastrophe beispiellosen Ausmaßes: Söldnerheere, Plünderungen, Hungersnöte und Seuchen vernichteten schätzungsweise ein Drittel, in manchen Regionen über die Hälfte der Gesamtbevölkerung.\n\nNach fünfjährigen zähen Verhandlungen in den beiden Verhandlungsstädten Münster (mit Frankreich und den katholischen Reichsständen) und Osnabrück (mit Schweden und den protestantischen Ständen) wurde am 24. Oktober 1648 das epochale Vertragswerk unterzeichnet (Instrumentum Pacis Monasteriense und Instrumentum Pacis Osnabrugense). Zum ersten Mal in der europäischen Geschichte war ein Universalfrieden das Ergebnis eines multilateralen Diplomatenkongresses, an dem Gesandte fast aller europäischen Mächte gleichberechtigt beteiligt waren. Die Leitprinzipien lauteten: Generalbegnadigung und Amnestie („ewiges Vergessen und Vergeben“ aller kriegerischen Handlungen), Gleichberechtigung aller Vertragsparteien und Interessenausgleich durch gegenseitige Konzessionen.\n\nDie zentralen Beschlüsse revolutionierten die Rechts- und Religionsordnung: Der Augsburger Religionsfriede von 1555 wurde bestätigt und auf die Reformierten (Calvinisten) ausgeweitet. Als konfessioneller Stichtag für Besitzstände und Bekenntnis wurde das „Normaljahr“ 1624 (Stand vom 1. Januar 1624) festgelegt, womit das Prinzip „cuius regio, eius religio“ faktisch entmachtet wurde – Untertanen durften nicht mehr willkürlich zur Konversion gezwungen werden. Auf dem Reichstag wurde bei religiösen Streitigkeiten das Mehrheitsprinzip durch das Verfahren der getrennten Beratung (itio in partes) ersetzt. Verfassungsrechtlich erhielten die Reichsstände das Bündnisrecht mit ausländischen Mächten (ius foederis), sofern dieses nicht gegen Kaiser und Reich gerichtet war, sowie die Landeshoheit. Durch die Einsetzung Frankreichs und Schwedens als Garantiemächte erhielt der Frieden eine völkerrechtliche Absicherung. Das Reich überdauerte als föderative Rechts- und Friedensordnung bis 1806.',
  abiSpotlight:{
   fokusTipp:'Exklusiver Leistungskurs-Schwerpunkt 2027: Der Westfälische Frieden ist nur im LK obligatorisch! Er dient als Referenzpunkt für das gesamte diachrone Friedensraster (1648, 1815, 1919, 1945): Untersuchen Sie Akteure, Leitprinzipien, Umgang mit den Besiegten (hier: kein Besiegter, sondern Verhandlungskompromiss) und Garantien.',
   operatorenHinweis:'Beim Operator „erörtern/beurteilen“ (AFB III) zum Stellenwert der Konfession: Differenzieren Sie präzise zwischen der religiösen Verrechtlichung (Normaljahr, Parität) und den machtpolitischen Triebfedern Frankreichs und Schwedens.',
   urteilHinweis:'Für die Urteilsbildung: Untersuchen Sie, ob die Formulierung „Muster einer Friedensordnung“ tragfähig ist. Würdigen Sie die Konfliktregelungskapazität des Friedens, ohne die territorialen Opfer und die spätere Schwächung der Zentralgewalt zu ignorieren.'
  },
  kontroverse:{
   name:'Geburtsstunde des souveränen Staatensystems vs. Der „Westfälische Mythos“ (Osiander / Kampmann)',
   these:'Die traditionelle Völkerrechtslehre und Politikwissenschaft sah in 1648 die Geburtsstunde des modernen „Westfälischen Systems“ völlig souveräner, territorial geschlossener Nationalstaaten, die sich emanzipiert von imperialen und religiösen Überbauten gegenüberstehen.',
   gegenposition:'Andreas Osiander und Christoph Kampmann dekonstruieren dies als Mythos: Der Frieden schuf kein anarchisches Staatensystem souveräner Einzelstaaten, sondern reformierte und stabilisierte das Alte Reich als übergeordnete, korporative Rechts- und Friedensordnung mit geteilter Herrschaftsgewalt.'
  },

{id:'IF7-S2', if:7, t:'Europäische Friedensordnung nach den Napoleonischen Kriegen',
 short:'Wiener Ordnung 1815',
 q:'Jahrhundertfrieden oder Knechtung der Völker – was leistete die Wiener Ordnung?',
 fokus:[],
 zum:[['15–27','Info: u. a. Napoleon und der Wiener Kongress'],['41–43','Forum: Jahrhundertfrieden oder Knechtung der Völker?'],['558–565','Info: Nationskriege und Friedensbemühungen im 19. und 20. Jh.']],
 ls:['frieden','nation'],
 dossier:{
  hook:{
   zitat:'Das größte Ziel der Mächte besteht darin, die Ruhe und das Gleichgewicht Europas auf festen Grundlagen wiederherzustellen und allen Völkern die Früchte eines dauerhaften Friedens zu sichern.',
   quelle:'Schlussakte des Wiener Kongresses, Präambel, 9. Juni 1815',
   frage:'War das Wiener Kongresssystem von 1815 ein genialer diplomatischer Jahrhundertfriede zur Bändigung von Großmachtkriegen oder ein reaktionäres Unterdrückungssystem gegen die Freiheit der Völker?'
  },
  ueberblick:'Nach über zwanzig Jahren ununterbrochener Revolutions- und Napoleonischer Kriege (1792–1815), die die traditionelle Landkarte Europas umgepflügt und die Herrschaftsstrukturen durch Code civil, Säkularisation und Mediatisierung grundlegend modernisiert hatten, traten von September 1814 bis Juni 1815 die europäischen Monarchen und Diplomaten auf dem Wiener Kongress zusammen. Unter der Regie des österreichischen Staatskanzlers Klemens Wenzel von Metternich, des britischen Außenministers Lord Castlereagh, des preußischen Kanzlers Karl August von Hardenberg, des russischen Zaren Alexander I. und des geschickten französischen Diplomaten Charles-Maurice de Talleyrand galt es, den Kontinent nach dem Sturz Napoleons neu zu ordnen.\n\nDie Verhandlungen basierten auf drei eng verknüpften Leitprinzipien: Restauration (Wiederherstellung der politischen Zustände von vor 1789, soweit pragmatisch möglich), Legitimität (Rechtmäßigkeit der fürstlichen Herrschaft aus Gottesgnadentum, Abweisung von Volkssouveränität) und Solidarität (gemeinsame Abwehr revolutionärer Bestrebungen durch die Monarchen). Die fundamentale strukturelle Leistung von 1815 lag im außenpolitischen Gleichgewicht der fünf Großmächte (Pentarchie: Großbritannien, Russland, Österreich, Preußen, Frankreich). Anders als spätere Friedensschlüsse wurde das besiegte Frankreich nicht zerschlagen oder wirtschaftlich ruiniert, sondern als gleichberechtigter Partner in das europäische Konzert integriert, um ein machtpolitisches Vakuum zu verhindern. Zur Stabilisierung Mitteleuropas wurde der Deutsche Bund als loser Staatenbund geschaffen, der defensiv nach außen wirken, aber keine offensive militärische Hegemonie entfalten sollte.\n\nZur langfristigen Absicherung der Ordnung etablierte der Wiener Kongress ein Novum der internationalen Beziehungen: das sogenannte „Kongresssystem“ bzw. das „Konzert der Mächte“. Auf regelmäßigen Botschafterkonferenzen (Aachen 1818, Troppau 1820, Laibach 1821, Verona 1822) stimmten die Großmächte Krisen friedlich ab. Gleichzeitig fungierte die im September 1815 gegründete „Heilige Allianz“ (Russland, Österreich, Preußen) als ideologisches Interventionsbündnis, das revolutionäre und nationale Erhebungen in Italien, Spanien und im Deutschen Bund (Karlsbader Beschlüsse 1819) mit militärischer Gewalt erstickte. Die historische Bilanz ist daher hochgradig ambivalent: Einerseits verhinderte die Wiener Ordnung bis zum Ausbruch des Ersten Weltkriegs 1914 einen allgemeinen gesamteuropäischen Großmachtkrieg; andererseits blockierte sie mit repressiver Härte die legitimen nationalen und liberal-demokratischen Freiheitsrechte der Völker.',
  abiSpotlight:{
   fokusTipp:'Für das Abitur 2027: Beherrschen Sie das analytische Vergleichsraster der Friedensordnungen (1648 vs. 1815 vs. 1919 vs. 1945). Achten Sie besonders auf den Umgang mit dem Besiegten (Reintegration Frankreichs vs. Bestrafung Deutschlands 1919) und den Sicherungsmechanismus (Pentarchie und Mächtekonzert).',
   operatorenHinweis:'Beim Operator „beurteilen/bewerten“ (AFB III) zur Stabilität der Wiener Ordnung: Trennen Sie zwingend zwischen zwischenstaatlichem Frieden (außenpolitische Stabilität) und innergesellschaftlichem Frieden (Unterdrückung von Bürgerrechten und Nationalstaatsbestrebungen).',
   urteilHinweis:'Für die Urteilsbildung: Setzen Sie sich mit der geschichtswissenschaftlichen Neubewertung durch Paul W. Schroeder auseinander, der das Wiener System als Übergang von kriegerischer Mächtekonkurrenz zu kooperativer Krisendiplomatie würdigt.'
  },
  kontroverse:{
   name:'Kooperative Friedensarchitektur vs. Reaktionäre Repression (Schroeder vs. Liberale Kritik)',
   these:'Paul W. Schroeder („The Transformation of European Politics“) betonte, dass 1815 eine fundamentale Wandlung vollzog: Weg von der aggressiven Macht- und Eroberungspolitik des 18. Jahrhunderts, hin zu einer neuen Kultur des völkerrechtlichen Konsenses, der gegenseitigen Rücksichtnahme und der kollektiven Krisenprävention.',
   gegenposition:'Die national-liberale und demokratische Geschichtsschreibung kritisierte das System Metternichs als rücksichtslose „Heilige Allianz der Fürsten gegen die Völker“, die das Selbstbestimmungsrecht der Völker mit Polizeistaatsmethoden knechtete und den Ausbruch der Revolutionen von 1848 provozierte.'
  },

{id:'IF7-S3', if:7, t:'Internationale Friedensordnung nach dem Ersten Weltkrieg',
 short:'Friedensordnung 1919',
 q:'Ein Frieden, der keinen Frieden brachte? Die Pariser Friedensordnung 1919/20',
 fokus:[],
 zum:[['169–182','Info: u. a. globale Dimension des Ersten Weltkriegs'],['198–207','Info: Zwischen Krieg und Krise (1919–1929)'],['208–212','Art. 231 und der Versailler Vertrag aus Sicht von Siegern und Besiegten'],['213–215','Forum: Frieden schließen 1919'],['566–574','Friedensideen und Friedensbewegungen · Der Völkerbund']],
 ls:['frieden','krise'],
 dossier:{
  hook:{
   zitat:'Die alliierten und assoziierten Regierungen erklären und Deutschland erkennt an, dass Deutschland und seine Verbündeten als Urheber für alle Verluste und aller Schäden verantwortlich sind, die die alliierten und assoziierten Regierungen und ihre Staatsangehörigen infolge des Krieges […] erlitten haben.',
   quelle:'Versailler Vertrag, Artikel 231 (Kriegsschuldartikel), 28. Juni 1919',
   frage:'War der Versailler Vertrag ein unhaltbarer „karthagischer Diktatfrieden“, der den Zweiten Weltkrieg unausweichlich machte – oder ein tragfähiger Kompromiss, der an mangelnder Durchsetzung und imperialem Revisionismus scheiterte?'
  },
  ueberblick:'Der Erste Weltkrieg (1914–1918) hatte als erster totaler und industrialisierter Massenkrieg mit über 17 Millionen Toten die traditionelle Weltordnung zertrümmert. Vier Großreiche waren kollabiert: das Zarenreich in Russland, die Habsburgermonarchie, das Osmanische Reich und das Deutsche Kaiserreich. Im Januar 1919 traten die Vertreter von 32 Siegerstaaten zur Pariser Friedenskonferenz zusammen. Die Verhandlungen wurden von den „Großen Vier“ dominiert: US-Präsident Woodrow Wilson, der französische Premierminister Georges Clemenceau, der britische Premier David Lloyd George und der italienische Ministerpräsident Vittorio Orlando. Grundlegend verschieden von 1648 und 1815 war das Verhandlungsformat: Die Besiegten wurden von den Beratungen ausgeschlossen und erhielten die fertigen Vertragsentwürfe ultimativ zur Unterschrift vorgelegt, was in Deutschland das verhängnisvolle Stigma eines „Diktatfriedens“ prägte.\n\nInhaltlich prallten unvereinbare Konzepte aufeinander: Während Woodrow Wilson mit seinen 14 Punkten das universale Selbstbestimmungsrecht der Völker, Abrüstung, offene Diplomatie und die Errichtung eines überstaatlichen Völkerbundes als Organ kollektiver Sicherheit einforderte, stand für Frankreich das fundamentale Sicherheitsbedürfnis und die nachhaltige Schwächung des deutschen Nachbarn im Zentrum („Guerre au Kaiser, paix à la France“). Großbritannien suchte nach der Balance of Power und fürchtete ein französisches Übergewicht. Das am 28. Juni 1919 im Spiegelsaal von Versailles unterzeichnete Vertragswerk bürdete der jungen Weimarer Republik schwere Lasten auf: Gebietsabtretungen (Elsass-Lothringen an Frankreich, Posen und Westpreußen an Polen [„Polnischer Korridor“], Nordschleswig, Eupen-Malmedy, Hultschiner Ländchen; Danzig als Freie Stadt; Memelland unter Völkerbundsverwaltung; Verlust aller Kolonien), massive militärische Beschränkungen (Berufsheer auf maximal 100.000 Mann limitiert, Verbot von Luftwaffe, Panzern, U-Booten; dauerhafte Entmilitarisierung des Rheinlands) sowie umfangreiche Reparationsforderungen.\n\nBesonders verhängnisvoll wirkte Artikel 231, der Deutschland und seinen Verbündeten die alleinige Urheberschaft und moralische Schuld am Krieg zuschrieb, um die Reparationen juristisch zu begründen. Dieser Passus wurde in der Weimarer Republik über alle Parteigrenzen hinweg als diffamierende „Kriegsschuldlüge“ verdammt und von nationalistischen und rechtsextremen Kräften wie der NSDAP propagandistisch instrumentalisiert („Dolchstoßlegende“). Hinzu kam die institutionelle Schwäche des 1920 gegründeten Völkerbundes: Da der US-Senat den Versailler Vertrag nicht ratifizierte und in den Isolationismus zurückkehrte, Deutschland und Sowjetrussland anfangs ausgeschlossen blieben und der Bund keine eigenen militärischen Zwangsmittel besaß, erwies sich das Pariser Vertragssystem als fragil. Anstatt dauerhaften Frieden zu stiften, hinterließ Versailles ein explosives Gemisch aus Revisionismus, Minderheitenkonflikten und geoökonomischer Instabilität.',
  abiSpotlight:{
   fokusTipp:'Für das Abitur 2027: Beherrschen Sie das Spannungsfeld zwischen den idealistischen 14 Punkten Wilsons (kollektive Sicherheit, Selbstbestimmung) und den realpolitischen Sicherheitsforderungen Clemenceaus sowie die innenpolitische Sprengkraft von Art. 231 für die Weimarer Republik.',
   operatorenHinweis:'Beim Operator „beurteilen/bewerten“ (AFB III) zu Artikel 231: Trennen Sie die juristisch-ökonomische Funktion (Haftungsgrundlage für Reparationen) von der politisch-psychologischen Wirkung (Radikalisierung der deutschen Öffentlichkeit gegen die Republik).',
   urteilHinweis:'Für die Urteilsbildung: Wägen Sie die Thesen von John Maynard Keynes („Karthagischer Frieden“) gegen die neuere geschichtswissenschaftliche Perspektive von Margaret MacMillan ab, die betont, dass Versailles Deutschland weder dauerhaft schwächte noch den Aufstieg des Nationalsozialismus monokausal determinierte.'
  },
  kontroverse:{

{id:'IF7-S4', if:7, t:'Konflikte und Frieden nach dem Zweiten Weltkrieg',

 fokus:[],
 zum:[['381–394','Info: Herausbildung des Ost-West-Konflikts · Marshall-Plan'],['447–457','Info: Ost-West-Konflikt 1947–1985 · Kuba-Krise'],['540–541','Im Fokus: Die europäische Einigung'],['576–588','Info: Der Weg zur Europäischen Union'],['589–598','Europa und der Frieden · Forum: Friedensmacht Europa']],

 dossier:{
  hook:{
   zitat:'Der Friede der Welt kann nicht gewahrt werden ohne schöpferische Anstrengungen, die der Größe der Bedrohung entsprechen […] Europa lässt sich nicht mit einem Schlage herstellen und auch nicht durch eine einfache Zusammenfassung: Es wird durch konkrete Tatsachen entstehen, die zunächst eine Solidarität der Tat schaffen.',
   quelle:'Robert Schuman, Erklärung zur Gründung der Montanunion, 9. Mai 1950',
   frage:'Was sicherte nach dem Zivilisationsbruch des Zweiten Weltkriegs den Frieden in Europa: das atomare Gleichgewicht des Schreckens im Kalten Krieg oder das supranationale Integrationsmodell der Europäischen Einigung?'
  },
  ueberblick:'Der Zweite Weltkrieg (1939–1945) war mit über 60 Millionen Toten, dem rassenideologischen Vernichtungskrieg und der industriellen Vernichtung von sechs Millionen Jüdinnen und Juden (Shoah) der größte Zivilisationsbruch der Menschheitsgeschichte. Er endete im Mai 1945 in Europa und im August 1945 in Asien mit den Atombombenabwürfen auf Hiroshima und Nagasaki. Auf den Kriegskonferenzen der „Großen Drei“ (Teheran 1943, Jalta Februar 1945 und Potsdam Juli/August 1945) versuchten USA, Sowjetunion und Großbritannien eine Nachkriegsordnung zu verabreden. Im Potsdamer Abkommen einigte man sich auf die vier „D“ (Denazifizierung, Demilitarisierung, Dezentralisierung, Demokratisierung), Reparationen aus den jeweiligen Zonen und die provisorische polnische Verwaltung der Gebiete östlich von Oder und Neiße. Ein formaler Friedensvertrag mit Deutschland wurde jedoch nie geschlossen – die endgültige völkerrechtliche Regelung erfolgte erst 45 Jahre später im Zwei-plus-Vier-Vertrag von 1990.\n\nAls universale Lehre aus dem Scheitern des Völkerbundes wurde am 26. Juni 1945 in San Francisco die Charta der Vereinten Nationen (UNO) unterzeichnet. Die UNO institutionalisierte ein umfassendes völkerrechtliches Gewaltverbot (Art. 2 Ziff. 4 UN-Charta) und übertrug dem UN-Sicherheitsrat die Hauptverantwortung für die Wahrung des Weltfriedens. Allerdings führte das Vetorecht der fünf ständigen Ratsmitglieder (USA, UdSSR, Großbritannien, Frankreich, China) dazu, dass das System kollektiver Sicherheit im heraufziehenden Kalten Krieg häufig handlungsunfähig blieb. Die bipolare Konfrontation zwischen der westlich-kapitalistischen Führungsmacht USA (Containment-Politik, Truman-Doktrin, NATO 1949) und dem sowjetisch-kommunistischen Machtblock (Kominform, Warschauer Pakt 1955) mündete in ein gigantisches nukleares Wettrüsten. Mehrfach stand die Welt am Rande der atomaren Vernichtung (Berlin-Krisen, Kuba-Krise 1962). Dennoch trug das atomare Patt („Mutually Assured Destruction“ / MAD) paradoxerweise dazu bei, einen direkten Waffengang der Supermächte in Europa zu verhindern.\n\nParallel zur Blockkonfrontation vollzog sich in Westeuropa eine historische Revolution der Friedensgestaltung: die europäische Einigung. Ausgehend von der Einsicht, dass künftige Kriege zwischen den europäischen Erzfeinden materiell unmöglich gemacht werden müssen, schlug der französische Außenminister Robert Schuman 1950 die Zusammenlegung der kriegswichtigen Kohle- und Stahlindustrie vor. Über die Montanunion (EGKS 1951), die Römischen Verträge (EWG und Euratom 1957), den Élysée-Vertrag zur deutsch-französischen Aussöhnung (1963) bis zum Vertrag von Maastricht (1992, Gründung der Europäischen Union) entstand ein supranationales Friedens- und Wirtschaftsnetzwerk, das Krieg zwischen den Mitgliedern unvorstellbar machte. Im KSZE-Prozess (Schlussakte von Helsinki 1975) gelang es schließlich, Blockkonfrontation und europäische Entspannung zu verbinden, indem Unverletzlichkeit der Grenzen mit der Durchsetzung universeller Menschenrechte verknüpft wurde – die normative Grundlage für die friedliche Überwindung des Eisernen Vorhangs 1989/90.',
  abiSpotlight:{
   fokusTipp:'Für das Abitur 2027: Beherrschen Sie das Wechselspiel dreier Friedensmechanismen nach 1945: (1) Globale kollektive Sicherheit (UNO-Charta vs. Völkerbund), (2) Bipolare Abschreckung und Rüstungskontrolle im Kalten Krieg (Gaddis-These vom „Long Peace“ vs. Stellvertreterkriege) sowie (3) Supranationale europäische Einigung (Schuman-Plan bis EU).',
   operatorenHinweis:'Beim Operator „beurteilen/erörtern“ (AFB III) zur Tragfähigkeit der Nachkriegsordnung: Unterscheiden Sie zwischen „negativem Frieden“ (reine Abwesenheit von Krieg durch atomare Abschreckung) und „positivem Frieden“ (struktureller Frieden durch Integration, Rechtsstaat und Wohlstand nach Johan Galtung).',
   urteilHinweis:'Für die Urteilsbildung: Reflektieren Sie, ob die Nachkriegsordnung ein eurozentrisches Erfolgsmodell war, da der Konflikt der Großmächte im globalen Süden in Form von verheerenden Stellvertreterkriegen (Korea, Vietnam, Nahost, Afrika) ausgetragen wurde.'
  },
  kontroverse:{
   name:'Der „Lange Frieden“ vs. Eurozentrische Täuschung (Gaddis vs. Postkoloniale Forschung)',
   these:'John Lewis Gaddis („The Long Peace“) argumentiert, dass die Stabilität der bipolaren Nuklearordnung, feste Einflusssphären und transparente Aufklärung den längsten Zeitraum ohne Großmachtkrieg in der modernen europäischen Geschichte garantierten.',
   gegenposition:'Kritische Historiker halten dem entgegen, dass dieser „Frieden“ nur für den globalen Norden galt: Durch die Verlagerung des Konflikts in blutige Stellvertreterkriege in der „Dritten Welt“ starben zwischen 1945 und 1989 über 20 Millionen Menschen.'
  },

  ['Feedback auf mein Urteil','Hier ist meine Antwort zur Aufgabe „[Aufgabe]“: [dein Text]. Gib mir Feedback nach drei Kriterien: 1) Unterscheide ich Sachurteil und Werturteil? 2) Sind meine Argumente historisch belegt? 3) Ist mein Fazit abgewogen? Schreibe meinen Text nicht neu, sondern nenne drei konkrete Verbesserungen.'],
  ['Begriff erklären – mit Prüfauftrag','Erkläre mir den Begriff [Begriff] in höchstens fünf Sätzen so, dass ich ihn in einer Geschichtsklausur verwenden kann, und nenne ein historisches Beispiel. Kennzeichne jede Aussage, bei der du unsicher bist.'],
  ['Advocatus Diaboli','Ich vertrete die These „[These]“. Nenne mir die drei stärksten Gegenargumente aus Sicht der Geschichtswissenschaft, ohne mir zuzustimmen. Nenne keine Literatur, die du nicht sicher kennst.']
 ]
};

const TANDEM = [
 ['Abfragen','10 Min.','Gegenseitig Karteikarten abfragen, Rollen nach fünf Minuten tauschen. Falsche Karten notieren.'],
 ['Erklären','15 Min.','Jede Person erklärt einen Schwerpunkt in drei Minuten ohne Notizen. Die andere prüft mit der Themenseite und hakt Stichworte ab.'],
 ['Urteils-Duell','15 Min.','Beide beantworten dieselbe Urteilsfrage in drei Sätzen. Vergleicht Argumente und Maßstäbe: Wo ist es ein Sachurteil, wo ein Werturteil?'],
 ['Absprache','5 Min.','Was nehmen wir uns bis zum nächsten Treffen vor? Termin festlegen.']
];

/* ===== Abi-Kompass · App ===== */
(function(){
'use strict';
const KEY='abikompass-ge-lk-2027';
const LV=['neu für mich','grob bekannt','kann ich erklären','kann ich beurteilen'];
const INT=[0,1,3,7,14,30];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/[„“"()]/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- Speicher ---------- */
function blank(){return {v:1,e:{},k:{},p:null,n:{},done:{},set:{theme:'auto'}};}
let canStore=false;
try{localStorage.setItem('__ak','1');localStorage.removeItem('__ak');canStore=true;}catch(e){canStore=false;}
let S=blank();
if(canStore){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(blank(),o);}}catch(e){}}
function save(){if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Datum ---------- */
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dd(a,b){return Math.round((b-a)/86400000);}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function monday(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
const EXD=pd(EXAM.date);
function daysLeft(){return Math.max(0,dd(today(),EXD));}

/* ---------- Indizes ---------- */
const KE=[];SP.forEach(sp=>sp.ke.forEach(k=>{k.sp=sp.id;KE.push(k);}));
const SPM={};SP.forEach((s,i)=>{SPM[s.id]=s;s.idx=i;});
const LSM={};LS.forEach(l=>LSM[l.id]=l);
function spStats(sp){const n=sp.ke.length;let sum=0,set=0;const c=[0,0,0,0];sp.ke.forEach(k=>{const v=S.e[k.id];if(v!==undefined){set++;sum+=v;c[v]++;}});return {n,set,p:sum/(3*n),c};}
function ifStats(no){const list=SP.filter(s=>s.if===no);let sum=0,n=0;list.forEach(s=>s.ke.forEach(k=>{n++;sum+=(S.e[k.id]||0);}));return n?sum/(3*n):0;}
function spNo(sp){const l=SP.filter(s=>s.if===sp.if);return [l.indexOf(sp)+1,l.length];}

/* ---------- Karteikarten ---------- */
const CARDS=[];
LEX.forEach(l=>CARDS.push({id:'L-'+slug(l[0]),kind:'Begriff',deck:'begriffe',ifs:[l[2]],front:l[0],back:'<p>'+l[1]+'</p>'+(l[4]?'<p class="small" style="color:var(--gold-ink)">⚠ '+l[4]+'</p>':'')}));
ZL.forEach(z=>CARDS.push({id:'Z-'+z[0],kind:'Datum',deck:'daten',ifs:z[3],front:'Wann? '+z[2],back:'<p style="font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--heading);margin:0">'+z[1]+'</p>'}));
KE.filter(k=>k.k==='UK').forEach(k=>CARDS.push({id:'U-'+k.id,kind:'Urteilsfrage',deck:'urteile',ifs:[SPM[k.sp].if],front:k.q,back:'<p class="small muted">Skizziere zuerst selbst ein Urteil. Mögliche Argumente:</p><p><b style="color:var(--lv3)">Dafür:</b> '+k.pro.join(' · ')+'</p><p><b style="color:var(--lv0)">Dagegen / relativierend:</b> '+k.con.join(' · ')+'</p>'}));
const CM={};CARDS.forEach(c=>CM[c.id]=c);
function isDue(c){const s=S.k[c.id];return s?pd(s.d)<=today():false;}
function isNew(c){return !S.k[c.id];}
function cardCounts(){let due=0,nw=0;const box=[0,0,0,0,0,0];CARDS.forEach(c=>{const s=S.k[c.id];if(!s){nw++;box[0]++;}else{box[s.f]++;if(pd(s.d)<=today())due++;}});return {due,nw,box};}

/* ---------- Planer ---------- */
function weekType(mon){
  const sun=add(mon,6);
  if(mon<=EXD&&sun>=EXD)return 'pruefung';
  for(const f of FERIEN){let c=0;for(let i=0;i<5;i++){const d=add(mon,i);if(d>=pd(f.von)&&d<=pd(f.bis))c++;}if(c>=3)return f.t==='Osterferien'?'ostern':'pause:'+f.t;}
  return 'lern';
}
function spread(tasks,weeks){if(!weeks.length)return;const per=Math.ceil(tasks.length/weeks.length);tasks.forEach((t,i)=>weeks[Math.min(weeks.length-1,Math.floor(i/per))].tasks.push(t));}
function genPlan(start,min){
  let mon=monday(pd(start));const weeks=[];
  if(mon>EXD)mon=monday(EXD);
  while(mon<=EXD){weeks.push({mon:ymd(mon),type:weekType(mon),phase:'',tasks:[]});mon=add(mon,7);}
  const L=weeks.filter(w=>w.type==='lern');const O=weeks.filter(w=>w.type==='ostern');
  const n=L.length;let a=Math.max(1,Math.round(n*0.45)),b=Math.max(n>=3?1:0,Math.round(n*0.35));if(a+b>n){a=Math.max(1,n-b);if(a+b>n)b=Math.max(0,n-a);}
  const WA=L.slice(0,a),WB=L.slice(a,a+b),WC=L.slice(a+b).concat(O);
  WA.forEach(w=>w.phase='A');WB.forEach(w=>w.phase='B');WC.forEach(w=>w.phase='C');
  const order=SP.slice().sort((x,y)=>{const d=spStats(x).p-spStats(y).p;if(Math.abs(d)>0.001)return d;const f=(y.fokus.length>0)-(x.fokus.length>0);return f||x.idx-y.idx;});
  const tA=order.map(sp=>({id:'sp-'+sp.id+'-A',typ:'sp',ref:sp.id,label:'Überblick: '+sp.short,min:90}));
  const tB=LS.map(l=>({id:'ls-'+l.id+'-B',typ:'ls',ref:l.id,label:'Längsschnitt: '+l.k,min:60}));
  order.filter(sp=>spStats(sp).p<0.67).forEach(sp=>tB.push({id:'uk-'+sp.id+'-B',typ:'uk',ref:sp.id,label:'Urteilsfragen vertiefen: '+sp.short,min:45}));
  tB.push({id:'kl-A-B',typ:'klausur',ref:'A',label:'Bauplan Aufgabenart A an einer Quelle üben',min:60},{id:'kl-B-B',typ:'klausur',ref:'B',label:'Bauplan Aufgabenart B an einer Darstellung üben',min:60});
  const fk=SP.filter(s=>s.fokus.length),rest=SP.filter(s=>!s.fokus.length);
  const tC=fk.concat(rest).map(sp=>({id:'wdh-'+sp.id+'-C',typ:'wdh',ref:sp.id,label:'Wiederholen: '+sp.short+(sp.fokus.length?' ★':''),min:45}));
  tC.push({id:'op-C',typ:'op',ref:'ops',label:'Operatoren-Trainer: 20 Fragen',min:20},{id:'zl-C',typ:'zl',ref:'zl',label:'Zeitleiste: dreimal „Ordnen“',min:20},{id:'dl-C',typ:'dl',ref:'dl',label:'Checkliste Darstellungsleistung und Zeitplan 300 Min. durchgehen',min:20});
  if(!WA.length&&!WB.length){spread(tA.concat(tB,tC),WC.length?WC:weeks.filter(w=>w.type!=='pruefung'));}
  else{spread(tA,WA);spread(tB,WB.length?WB:WA);spread(tC,WC.length?WC:(WB.length?WB:WA));}
  weeks.forEach(w=>{
    if(w.type==='lern'||w.type==='ostern')w.tasks.unshift({id:'karten-'+w.mon,typ:'karten',ref:'k',label:'Karteikarten: 3 × 15 Minuten',min:45});
    else if(w.type.indexOf('pause')===0){w.phase='F';w.tasks.push({id:'pause-'+w.mon,typ:'pause',ref:'',label:'Pause – Erholung gehört zum Plan. Wer mag: 15 Minuten Karteikarten.',min:15});}
    else if(w.type==='pruefung'){w.phase='C';w.tasks.push({id:'final',typ:'final',ref:'',label:'Letzter Check: Zeitplan und Checkliste lesen, Material packen, früh schlafen. Prüfung am '+EXAM.label+'.',min:30});}
  });
  return {start,min:+min,weeks,created:ymd(today())};
}
if(!S.p){const st=today()<EXD?ymd(today()):ymd(add(EXD,-7));S.p=genPlan(st,180);S.p.example=true;save();}
function curWeekIdx(){const t=today();const w=S.p.weeks;for(let i=0;i<w.length;i++){const m=pd(w[i].mon);if(t>=m&&t<add(m,7))return i;}return t<pd(w[0].mon)?0:w.length-1;}
function taskHref(t){return {sp:'#/sp/'+t.ref,uk:'#/sp/'+t.ref,wdh:'#/sp/'+t.ref,ls:'#/ls/'+t.ref,klausur:'#/klausur',op:'#/klausur',dl:'#/klausur',zl:'#/zeitleiste',karten:'#/karten'}[t.typ]||'';}
const PH={A:['Zyklus 1 · Überblick','ph-A'],B:['Zyklus 2 · Vertiefen','ph-B'],C:['Zyklus 3 · Wiederholen','ph-C'],F:['Ferien','ph-F']};
function taskLi(t){const d=!!S.done[t.id];const h=taskHref(t);return '<li class="task'+(d?' done':'')+'"><input type="checkbox" id="t-'+esc(t.id)+'" data-act="task" data-id="'+esc(t.id)+'"'+(d?' checked':'')+'><div class="lbl"><label for="t-'+esc(t.id)+'" class="sr">erledigt</label>'+(h?'<a href="'+h+'">'+esc(t.label)+'</a>':esc(t.label))+'<div class="meta">ca. '+t.min+' Min.</div></div></li>';}

/* ---------- UI-Zustand ---------- */
let TF='alle',TLF={if:0,ls:''},TLM='liste',ORD=null,LXF={q:'',bel:false,if:0,tab:'begriffe'},OPQ={cur:null,opts:[],ans:null,score:0,total:0},SES=null,DECK={d:'mix',f:0},RESET=false;

/* ---------- Bausteine ---------- */
function ring(p,size){size=size||56;const r=22,c=2*Math.PI*r,o=c*(1-p),pc=Math.round(p*100);return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 54 54" role="img" aria-label="'+pc+' Prozent"><circle class="bg" cx="27" cy="27" r="'+r+'" fill="none" stroke-width="6"/><circle class="fg" cx="27" cy="27" r="'+r+'" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+o.toFixed(2)+'" transform="rotate(-90 27 27)"/><text x="27" y="31.5" text-anchor="middle">'+pc+'%</text></svg>';}
function phead(eb,title,q,extra){return '<header class="phead"><div class="eyebrow">'+eb+'</div><h1>'+title+'</h1>'+(q?'<p class="leitfrage">'+q+'</p>':'')+'<div class="goldbar"></div>'+(extra||'')+'</header>';}
function foot(){return '<footer class="foot">Grundlagen: Kernlehrplan Geschichte Sek. II NRW (2014, Leistungskurs) · Vorgaben Zentralabitur 2027 Geschichte (MSB NRW) · Operatorenübersicht Geschichte (abitur.nrw). Seitenangaben: „Zeiten und Menschen“, Qualifikationsphase (ISBN 978-3-14-024990-4). Alle Schwerpunkte des Kernlehrplans sind prüfungsrelevant; ★ markiert die Fokussierungen 2027.</footer>';}

/* ---------- Views ---------- */
function vStart(){
  const dl=daysLeft(),cc=cardCounts(),wi=curWeekIdx(),w=S.p.weeks[wi];
  const weak=SP.slice().sort((a,b)=>{const d=spStats(a).p-spStats(b).p;if(Math.abs(d)>0.001)return d;return (b.fokus.length>0)-(a.fokus.length>0)||a.idx-b.idx;})[0];
  const uk=weak.ke.find(k=>k.k==='UK');
  const ph=PH[w.phase]||['',''];
  let h=phead('Geschichte · Leistungskurs · Abitur 2027','Dein Abi-Kompass','','<p class="lead">Alle 14 Schwerpunkte der Abiturvorgaben 2027 mit Stichworten, Urteilsfragen und Hilfen – dazu dein Lernplan, Karteikarten und der Klausur-Werkzeugkasten.</p>');
  h+='<div class="dash-top"><section class="countdown" aria-label="Countdown"><svg class="needle" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/><path d="M50 8 L58 50 L50 92 L42 50 Z" fill="#f5c518"/><circle cx="50" cy="50" r="6" fill="#fff"/></svg><div class="eb">Schriftliche Prüfung</div><div class="big">'+dl+'<small>Tage</small></div><div class="sub">bis '+EXAM.label+'</div><div class="facts"><span>'+EXAM.dauer+'</span><span>3 Aufgaben zur Wahl</span><span>Nachschreibtermin '+EXAM.nach+'</span></div></section>';
  h+='<section class="card"><div class="row"><h3 style="margin:0">Diese Woche</h3>'+(ph[0]?'<span class="tagph '+ph[1]+'">'+ph[0]+'</span>':'')+'<span class="spacer"></span><a class="btn sm ghost" href="#/planer">Planer</a></div><p class="small muted" style="margin:4px 0 10px">Woche ab '+fmt(pd(w.mon))+(S.p.example?' · Vorschlag – im Planer an deine Lernzeit anpassen':'')+'</p><ul class="week-list">'+w.tasks.map(taskLi).join('')+'</ul></section></div>';
  h+='<h2>Dein Stand je Inhaltsfeld</h2><div class="rings" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">'+[4,5,6,7].map(no=>'<a class="ringcard" href="#/themen">'+ring(ifStats(no))+'<div><div class="t">Inhaltsfeld '+no+'</div><div class="d">'+IFS[no].k+'</div></div></a>').join('')+'</div><p class="small muted" style="margin-top:8px">Der Stand ergibt sich aus deiner Selbsteinschätzung zu jeder Kompetenzerwartung: 100 % heißt „kann ich beurteilen“ überall.</p>';
  h+='<div class="grid g2" style="margin-top:22px"><section class="card"><h3>Karteikarten</h3><p><b style="font-family:var(--f-display);font-size:28px;color:var(--heading)">'+cc.due+'</b> fällig · '+cc.nw+' noch neu</p><a class="btn primary" href="#/karten">Karten lernen</a></section>';
  h+='<section class="card"><h3>Heute 30 Minuten?</h3><ul class="tight"><li>15 Min. Schwerpunkt: <a href="#/sp/'+weak.id+'">'+weak.short+'</a></li><li>10 Min. Karteikarten (gemischter Stapel)</li><li>5 Min. Urteilsfrage: <i>'+(uk?esc(uk.q):'')+'</i></li></ul><p class="small muted" style="margin-top:8px">Vorschlag nach deiner schwächsten Einschätzung.</p></section></div>';
  h+='<h2>So arbeitest du mit dem Abi-Kompass</h2><div class="steps"><div class="card"><h3>Einschätzen</h3><p class="small">Öffne jeden Schwerpunkt und schätze dich zu jeder Kompetenzerwartung ein – ehrlich, das steuert deinen Plan.</p><a href="#/themen">Zur Themenkarte</a></div><div class="card"><h3>Planen</h3><p class="small">Der Planer verteilt alle Schwerpunkte in drei Zyklen bis zum 13. April – Schwächen zuerst.</p><a href="#/planer">Zum Planer</a></div><div class="card"><h3>Üben</h3><p class="small">Kurz und oft: Karteikarten, Urteilsfragen, Baupläne für die Klausur. Lieber täglich 30 Minuten als einmal drei Stunden.</p><a href="#/lernen">Lernstrategien</a></div></div>';
  h+='<div class="note" style="margin-top:22px"><b>Deine Daten bleiben bei dir.</b> Einschätzungen, Plan und Karten werden nur in diesem Browser gespeichert'+(canStore?'':' – hier ist der Speicher allerdings gesperrt, dein Fortschritt geht beim Schließen verloren')+'. Unter <a href="#/sichern">Sichern &amp; Drucken</a> kannst du deinen Stand auf ein anderes Gerät übertragen.</div>';
  return h+foot();
}

function vThemen(){
  let h=phead('Themenkarte','14 Schwerpunkte, 4 Inhaltsfelder','Alle Schwerpunkte sind Pflicht. Die Fokussierungen 2027 (★) zeigen, worauf die Aufgaben besonders zugreifen können.');
  h+='<div class="filters noprint" role="group" aria-label="Filter"><button class="chip" data-act="tf" data-v="alle" aria-pressed="'+(TF==='alle')+'">Alle</button><button class="chip" data-act="tf" data-v="fokus" aria-pressed="'+(TF==='fokus')+'">★ Fokus 2027</button><button class="chip" data-act="tf" data-v="luecken" aria-pressed="'+(TF==='luecken')+'">Meine Lücken</button></div>';
  [4,5,6,7].forEach(no=>{
    let list=SP.filter(s=>s.if===no);
    if(TF==='fokus')list=list.filter(s=>s.fokus.length);
    if(TF==='luecken')list=list.filter(s=>s.ke.some(k=>(S.e[k.id]===undefined||S.e[k.id]<2)));
    if(!list.length)return;
    h+='<section class="ifsec"><div class="ifhead"><span class="no">IF '+no+'</span><h2>'+IFS[no].t+'</h2></div>';
    if(IFS[no].dossier){
      const idos=IFS[no].dossier;
      h+='<details class="card if-dossier-card" style="margin-bottom:14px"><summary class="if-dossier-sum" style="cursor:pointer"><div class="row" style="gap:8px"><span class="chip sk">📖 Epochen-Überblick &amp; Leitfaden IF '+no+'</span><span class="spacer"></span><span class="small muted noprint">Aufklappen / Zuklappen</span></div></summary><div style="margin-top:12px"><p class="leitfrage" style="margin:4px 0 10px"><b>Leitfrage:</b> '+esc(idos.leitfrage)+'</p><div class="dossier-text small" style="line-height:1.6;color:var(--body)">'+esc(idos.epochenueberblick)+'</div><div class="note small" style="margin-top:10px"><b>Abiturleitfaden 2027 LK:</b> '+esc(idos.abiturleitfaden)+'</div></div></details>';
    }
    h+='<div class="tiles">';
    list.forEach(sp=>{const st=spStats(sp);h+='<a class="tile" href="#/sp/'+sp.id+'"><div class="top">'+ring(st.p,50)+'<div class="tt">'+sp.t+'</div></div><div class="q">'+sp.q+'</div><div class="ft">'+(sp.fokus.length?'<span class="chip fokus">★ Fokus 2027</span>':'')+'<span class="chip">'+sp.ke.length+' Kompetenzerwartungen</span>'+(st.set<st.n?'<span class="chip zum">'+(st.n-st.set)+' offen</span>':'')+'</div></a>';});
    h+='</div></section>';
  });
  return h+foot();
}

function dossierHtml(sp){
  const d=sp.dossier;
  if(!d)return '';

  if(d.hook){
    h+='<blockquote class="dossier-hook"><p class="dossier-quote">„'+esc(d.hook.zitat)+'“</p><cite class="dossier-cite">— '+esc(d.hook.quelle)+'</cite></blockquote>';

  }
  h+='<div class="dossier-text">'+paras+'</div>';

    h+='<div class="spotlight-item"><b style="color:var(--lv3)">Urteilsbildung (AFB III):</b> '+esc(d.abiSpotlight.urteilHinweis)+'</div>';
    h+='</div>';
  }
  if(d.kontroverse){
    h+='<div class="dossier-kontroverse"><div class="eb">⚖ Wissenschaftliche Kontroverse</div>';
    h+='<h4 style="margin:4px 0 8px;color:var(--heading)">'+esc(d.kontroverse.name)+'</h4>';

function answer(ok){const id=SES.q[SES.i];const s=S.k[id]||{f:0,d:ymd(today())};if(ok){s.f=Math.min(5,(s.f||0)+1);SES.ok++;}else{s.f=1;SES.no++;}s.d=ymd(add(today(),INT[s.f]));S.k[id]=s;save();SES.i++;SES.flip=false;render(true);}
document.addEventListener('click',e=>{

  if(e.target.closest('#themebtn')){S.set.theme={auto:'light',light:'dark',dark:'auto'}[S.set.theme]||'auto';save();applyTheme();return;}
  if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'tf':TF=b.dataset.v;render(true);break;
    case 'tlm':TLM=b.dataset.v;if(TLM==='ordnen')newOrder();render(true);break;
    case 'tlif':TLF.if=+b.dataset.v;if(TLM==='ordnen')newOrder();render(true);break;
    case 'tlls':TLF.ls=b.dataset.v;if(TLM==='ordnen')newOrder();render(true);break;
    case 'up':case 'down':{const i=+b.dataset.i,j=a==='up'?i-1:i+1;const it=ORD.items;[it[i],it[j]]=[it[j],it[i]];render(true);const btn=$('.order-list li:nth-child('+(j+1)+') [data-act="'+a+'"]')||$('.order-list li:nth-child('+(j+1)+') button');if(btn)btn.focus();break;}
    case 'ordcheck':ORD.checked=true;render(true);break;
    case 'ordnew':newOrder();render(true);break;
    case 'lexbel':LXF.bel=!LXF.bel;render(true);break;
    case 'lexif':LXF.if=+b.dataset.v;render(true);break;
    case 'lextab':LXF.tab=b.dataset.v;render(true);break;
    case 'sesstart':startSession();if(!SES.q.length){SES=null;toast('Keine Karten in dieser Auswahl fällig – wähle einen anderen Stapel.');}render(false);break;
    case 'cflip':SES.flip=true;render(true);break;
    case 'cok':answer(true);break;
    case 'cno':answer(false);break;
    case 'cend':SES={q:SES.q.slice(0,SES.i),i:SES.i,ok:SES.ok,no:SES.no};render(false);break;
    case 'opa':OPQ.ans=+b.dataset.i;OPQ.total++;if(OPQ.opts[OPQ.ans]===OPQ.cur)OPQ.score++;render(true);break;
    case 'opn':newOp();render(true);break;
    case 'scroll':{const t=document.getElementById('k-'+b.dataset.t);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'copyp':copyText(KI.prompts[+b.dataset.i][1]);break;
    case 'pgen':{const st=$('#pstart').value||ymd(today());const mn=+$('#pmin').value;S.p=genPlan(st,mn);S.p.example=false;save();render(true);toast('Plan neu berechnet.');break;}
    case 'tmove':{const w=+b.dataset.w;const wk=S.p.weeks[w];const k=wk.tasks.findIndex(t=>t.id===b.dataset.id);if(k>-1&&S.p.weeks[w+1]){const t=wk.tasks.splice(k,1)[0];S.p.weeks[w+1].tasks.push(t);S.p.example=false;save();render(true);toast('In die nächste Woche verschoben.');}break;}
    case 'bmake':{const code='AK27:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bout').value=code;break;}
    case 'bcopy':{const ta=$('#bout');if(!ta.value){toast('Erzeuge zuerst einen Code.');break;}copyText(ta.value,ta);break;}
    case 'bload':{const raw=$('#bin').value.trim().replace(/^AK27:/,'');try{const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||o.v!==1)throw 0;S=Object.assign(blank(),o);save();applyTheme();toast('Stand übernommen.');location.hash='#/start';render(false);}catch(err){toast('Der Code ist unvollständig oder beschädigt. Bitte vollständig kopieren und erneut einfügen.');}break;}
    case 'reset':if(!RESET){RESET=true;render(true);}else{RESET=false;S=blank();S.p=genPlan(today()<EXD?ymd(today()):ymd(add(EXD,-7)),180);S.p.example=true;save();applyTheme();toast('Alles zurückgesetzt.');render(true);}break;
    case 'print':window.print();break;
    case 'skip':{const m=$('#main');if(m)m.focus();break;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;
  if(a==='lvl'){S.e[t.dataset.ke]=+t.value;save();const sp=SPM[route().id];if(sp){const st=spStats(sp);const aside=$('.sp-aside .card');if(aside)aside.outerHTML='<section class="card"><h3>Dein Stand</h3><div class="row" style="gap:14px">'+ring(st.p,64)+'<div class="small">'+st.set+' von '+st.n+' eingeschätzt</div></div><div style="margin-top:8px">'+LV.map((l,i)=>'<div class="stat"><span>'+l+'</span><b>'+st.c[i]+'</b></div>').join('')+'</div></section>';}}
  else if(a==='task'){S.done[t.dataset.id]=t.checked;save();const li=t.closest('.task');if(li)li.classList.toggle('done',t.checked);}
  else if(a==='deckd'){DECK.d=t.value;}
  else if(a==='deckf'){DECK.f=+t.value;}
});
let noteT;
document.addEventListener('input',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.act;
  if(a==='note'){clearTimeout(noteT);noteT=setTimeout(()=>{S.n[t.dataset.sp]=t.value;save();},400);}
  else if(a==='lexq'){LXF.q=t.value;$('#lexlist').innerHTML=(LXF.tab==='begriffe'?lexList():dossierLexList());}
});
document.addEventListener('keydown',e=>{
  if(route().v!=='karten'||!SES||SES.i>=SES.q.length)return;
  if(e.target.matches('input,select,textarea'))return;
  if(e.code==='Space'){e.preventDefault();if(!SES.flip){SES.flip=true;render(true);}}
  else if(SES.flip&&(e.key==='ArrowRight'||e.key==='j'))answer(true);
  else if(SES.flip&&(e.key==='ArrowLeft'||e.key==='n'))answer(false);
});
window.addEventListener('beforeprint',()=>$$('details').forEach(d=>{if(!d.open){d.open=true;d.dataset.pc='1';}}));
window.addEventListener('afterprint',()=>$$('details[data-pc]').forEach(d=>{d.open=false;delete d.dataset.pc;}));

applyTheme();render(false);
})();

</script>
</body>
</html>
